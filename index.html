function connDot() {
  const ses = App.ses; if (!ses) return '';
  const foeOn = ses.presence.includes('p' + ses.foe);
  const cls = ses.status === 'error' || ses.status === 'lost' ? 'bad' : ses.status === 'ok' ? 'on' : '';
  const t = ses.status === 'error' ? 'Verbindung gestört' : ses.status === 'lost' ? 'Verbindung unterbrochen' : ses.status === 'ok' ? 'Verbunden' : 'Verbinde …';
  return `<span class="row" style="gap:6px;flex:none;font-size:12px" title="${t}"><span class="dot ${cls}"></span><span class="muted">${ses.transport.kind === 'bot' ? 'Einzelspieler' : t === 'Verbunden' ? (ses.state.players[ses.foe]?.token ? (foeOn ? 'Gegner online' : 'Gegner offline') : 'verbunden') : t}</span></span>`;
}
async function drawQR() {
  const el = $('#qr'); if (!el) return;
  try {
    if (!window.QRCode) await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
    el.innerHTML = ''; new window.QRCode(el, { text: joinLink(App.ses.code), width: 170, height: 170, colorDark: '#122739', colorLight: '#ffffff' });
  } catch { el.remove(); }
}

/* ============================================================
   Flotte aufstellen
   ============================================================ */
function draft() {
  const ses = App.ses;
  if (!ses.rec.draft) ses.persist({ draft: { fleet: [], mines: [] } });
  return ses.rec.draft;
}
function setDraft(d) { App.ses.persist({ draft: d }); }
function viewSetup() {
  const ses = App.ses, S = ses.state, st = S.settings, n = st.n, ready = !!S.players[ses.me].hash;
  const d = ready ? ses.rec.setup : draft();
  const want = SV.instances(st.fleet), placed = new Set(d.fleet.map((s) => s.id));
  const needMines = SV.minesFor(st), minesLeft = needMines - d.mines.length;
  const err = SV.validSetup(d, st);
  const ui = App.ui;
  const ov = {};
  for (const m of d.mines) ov[m] = { m: 'mine' };
  const board = boardHTML({ n, id: 'own', kind: 'own setup', ships: d.fleet.map((s) => ({ ...s, cls: ui.selShip === s.id ? 'sel' : '' })), ov, locked: ready });
  const foeReady = !!S.players[ses.foe].hash;
  return `<div class="wrap">
    <header class="top"><button class="ib" data-act="home" aria-label="Zurück">${ICON.back}</button><span class="ttl">Flotte aufstellen</span>${connDot()}</header>
    <div class="narrow stack">
      ${ready ? `<div class="status wait"><span class="pulse"></span><span><b>Flotte bereit</b><small>${foeReady ? 'Gleich geht es los …' : `${esc(S.players[ses.foe].name)} stellt noch auf.`}</small></span></div>`
        : `<div class="status"><span><b>${esc(S.players[ses.foe].name)} ist da</b><small>Ziehe deine Schiffe aufs Feld. Tippen dreht ein Schiff, Ziehen verschiebt es.${!st.touch ? ' Zwischen den Schiffen muss ein Feld Wasser bleiben.' : ''}</small></span></div>`}
      <div class="boardbox">${board}</div>
      ${ready ? '' : `
      <div class="dock" id="dock">${want.filter((x) => !placed.has(x.id)).map((x) => `<button class="d" data-dock="${x.id}" aria-pressed="${ui.pick === x.id}">${sil(x.k, 18)}<span>${esc(x.label)}</span></button>`).join('')}
        ${minesLeft > 0 ? `<button class="d" data-dock="mine" aria-pressed="${ui.pick === 'mine'}"><svg class="sil" viewBox="0 0 24 24" style="width:20px">${MARK.mine.slice(MARK.mine.indexOf('>') + 1, -6)}</svg><span>Seemine × ${minesLeft}</span></button>` : ''}
        ${placed.size === want.length && minesLeft <= 0 ? '<span class="empty">Alles auf dem Wasser.</span>' : ''}</div>
      <div class="row">
        <button class="btn" data-act="rotnew">${ui.vNew ? 'Neue Schiffe: senkrecht' : 'Neue Schiffe: waagerecht'}</button>
        <button class="btn" data-act="random">Zufällig verteilen</button>
        <button class="btn ghost" data-act="clear">Alle zurück</button>
      </div>
      ${needMines ? `<p class="hint">Minen: Wähle „Seemine“ und tippe auf ein freies Feld. Tippe eine gelegte Mine an, um sie wieder aufzunehmen.</p>` : ''}
      <button class="btn pri block" data-act="ready" ${err ? 'disabled' : ''} style="min-height:54px;font-size:17px">Flotte bereit</button>
      ${err && placed.size === want.length ? `<p class="hint warn">${esc(err)}</p>` : ''}`}
    </div></div>`;
}

/* Ziehen & Ablegen beim Aufstellen */
const Drag = { d: null };
function setupPointerDown(e) {
  if (App.screen !== 'setup' || App.ses.state.players[App.ses.me].hash) return;
  const dockBtn = e.target.closest('[data-dock]');
  const cellBtn = e.target.closest('#own .cell');
  const dd = draft();
  if (dockBtn) {
    const id = dockBtn.dataset.dock;
    Drag.d = { id, fromDock: true, off: 0, v: !!App.ui.vNew, x: e.clientX, y: e.clientY, moved: false };
  } else if (cellBtn) {
    const i = +cellBtn.dataset.i;
    const s = dd.fleet.find((x) => SV.shipCells(x).includes(i));
    if (s) Drag.d = { id: s.id, fromDock: false, off: SV.shipCells(s).indexOf(i), v: s.v, x: e.clientX, y: e.clientY, moved: false, cell: i };
    else { Drag.d = { tap: i }; }
  } else return;
  e.preventDefault();
}
function ghostAt(x, y) {
  const el = document.elementFromPoint(x, y)?.closest('#own .cell');
  return el ? +el.dataset.i : null;
}
function candidate(id, anchor, off, v) {
  if (id === 'mine') return null;
  const [r, c] = SV.rc(anchor), k = id.replace(/\d+$/, '');
  return { id, k, r: v ? r - off : r, c: v ? c : c - off, v };
}
function placeOk(dd, s, st) {
  const others = dd.fleet.filter((x) => x.id !== s.id);
  if (!SV.fits(SV.occupancy(others), s, st.n, st.touch)) return false;
  const cells = SV.shipCells(s);
  return !dd.mines.some((m) => cells.includes(m));
}
function paintGhost(cells, ok) {
  $$('#own .ov.gh').forEach((x) => x.remove());
  const b = $('#own'); if (!b) return;
  for (const i of cells) {
    const [r, c] = SV.rc(i); if (r < 0 || c < 0 || r >= App.ses.state.settings.n || c >= App.ses.state.settings.n) continue;
    const o = document.createElement('i'); o.className = 'ov gh' + (ok ? '' : ' bad'); o.style.cssText = `grid-row:${r + 2};grid-column:${c + 2}`; b.appendChild(o);
  }
}
function setupPointerMove(e) {
  const d = Drag.d; if (!d || d.tap != null) return;
  if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8) d.moved = true;
  if (!d.moved || d.id === 'mine') return;
  const a = ghostAt(e.clientX, e.clientY);
  if (a == null) { paintGhost([], true); d.target = null; return; }
  const s = candidate(d.id, a, d.off, d.v);
  const ok = placeOk(draft(), s, App.ses.state.settings);
  d.target = ok ? s : null;
  paintGhost(SV.shipCells(s), ok);
}
function setupPointerUp(e) {
  const d = Drag.d; Drag.d = null; if (!d) return;
  const st = App.ses.state.settings, dd = structuredClone(draft());
  if (d.tap != null) { return boardTapSetup(d.tap); }
  if (d.moved) {
    paintGhost([], true);
    if (d.target) { dd.fleet = dd.fleet.filter((x) => x.id !== d.id).concat([d.target]); setDraft(dd); App.ui.pick = null; Sound.play('click'); render(); }
    else if (!d.fromDock && !$('#own')?.contains(document.elementFromPoint(e.clientX, e.clientY))) { dd.fleet = dd.fleet.filter((x) => x.id !== d.id); setDraft(dd); render(); }
    else toast('Dort passt das Schiff nicht hin.');
    return;
  }
  if (d.fromDock) { App.ui.pick = App.ui.pick === d.id ? null : d.id; render(); return; }
  // Antippen eines gesetzten Schiffs: drehen
  const s = dd.fleet.find((x) => x.id === d.id);
  const tryRot = (off) => { const [r, c] = SV.rc(d.cell); const v = !s.v; return { ...s, v, r: v ? r - off : r, c: v ? c : c - off }; };
  const len = SV.SHIP[s.k].len;
  let done = false;
  for (const off of [d.off, ...SV.range(len)]) { const t = tryRot(off); if (placeOk(dd, t, st)) { Object.assign(s, t); done = true; break; } }
  if (done) { setDraft(dd); Sound.play('click'); render(); } else toast('Zum Drehen ist hier kein Platz.');
}
function boardTapSetup(i) {
  const st = App.ses.state.settings, dd = structuredClone(draft()), pick = App.ui.pick;
  if (dd.mines.includes(i)) { dd.mines = dd.mines.filter((m) => m !== i); setDraft(dd); render(); return; }
  if (pick === 'mine') {
    if (dd.fleet.some((s) => SV.shipCells(s).includes(i))) return toast('Minen gehören ins freie Wasser.');
    dd.mines.push(i); if (dd.mines.length >= SV.minesFor(st)) App.ui.pick = null; setDraft(dd); Sound.play('click'); render(); return;
  }
  if (pick) {
    const s = candidate(pick, i, 0, !!App.ui.vNew);
    if (!placeOk(dd, s, st)) return toast('Dort passt das Schiff nicht hin.');
    dd.fleet.push(s); App.ui.pick = null; setDraft(dd); Sound.play('click'); render(); return;
  }
  toast('Wähle unten ein Schiff oder ziehe es aufs Feld.');
}

/* ============================================================
   Gefecht
   ============================================================ */
function myAbilities(ses) {
  const F = ses.fleet(); if (!F || ses.state.settings.mode !== 'ab') return [];
  const map = new Map();
  for (const s of F.ships) for (const ab of SV.SHIP[s.k].ab) {
    const e = map.get(ab) || { ab, left: 0, total: 0, ship: null, alive: false };
    const used = (F.used[s.id] || {})[ab] || 0;
    e.total += SV.AB[ab].uses;
    if (!s.sunk) { e.alive = true; e.left += SV.AB[ab].uses - used; if (!e.ship && used < SV.AB[ab].uses) e.ship = s.id; }
    map.set(ab, e);
  }
  return [...map.values()];
}
function draftAction() {
  const u = App.ui;
  if (u.i == null) return null;
  if (!u.ab) return { t: 'shot', i: u.i };
  const a = { t: u.ab, ab: u.ab, ship: u.ship, i: u.i };
  if (u.ab === 'breitseite' || u.ab === 'radar' || u.ab === 'torpedo') a.v = !!u.v;
  if (u.ab === 'torpedo') a.rev = !!u.rev;
  if (u.ab === 'schnellfeuer') { if (u.j == null) return null; a.j = u.j; }
  return a;
}
function viewBattle() {
  const ses = App.ses, S = ses.state, st = S.settings, n = st.n, me = ses.me, foe = ses.foe, ui = App.ui;
  const F = ses.fleet(), K = S.known[me], KF = S.known[foe];
  const myTurn = S.phase === 'battle' && S.turn === me && !S.pending;
  const over = S.phase === 'over';
  const abs = myAbilities(ses);
  const a = draftAction();
  const pv = a ? new Set(SV.cellsOf(a, n)) : new Set();
  const pName = S.players[foe].name;

  // Zielgebiet
  const tOv = {};
  for (const [i, s] of Object.entries(K)) tOv[i] = { m: s === 'sunk' ? 'hit' : s, c: s };
  const tShips = S.sunk[me].map((s) => ({ ...fromCells(s.k, s.cells), cls: 'sunk wreck' }));
  if (over && S.reveals[foe]) {
    const sunkIds = new Set(S.sunk[me].map((s) => s.id));
    for (const s of S.reveals[foe].setup.fleet) if (!sunkIds.has(s.id)) tShips.push({ ...s, cls: 'reveal' });
    for (const m of S.reveals[foe].setup.mines || []) if (!K[m]) tOv[m] = { m: 'mine', c: 'reveal' };
  }
  const tgtView = ui.ab !== 'reparatur';
  if (!over && myTurn && tgtView) {
    for (const i of pv) { const ex = tOv[i] || {}; tOv[i] = { ...ex, c: (ex.c || '') + (ui.ab === 'torpedo' ? ' trail' : ' pv') }; }
    if (ui.i != null && tgtView) { const ex = tOv[ui.i] || {}; tOv[ui.i] = { ...ex, c: (ex.c || '') + ' pv sel' }; }
  }
  const zonesOf = (p, cls) => S.actions.filter((x) => x.p === p && !x.self && SV.ZONE_AB.has(x.a.t)).map((x) => ({ ...SV.zoneOf(x.a, x.r, n), cls }));
  const blk = over ? null : SV.blockedCells(K, n, st.touch);
  const targetBoard = boardHTML({ n, id: 'tgt', kind: 'target', ships: tShips, ov: tOv, locked: !myTurn || !tgtView, zones: zonesOf(me, ''), blocked: blk,
    cell: (i) => ({ c: (K[i] === 'sunk' ? 'ks ' : '') + (!K[i] || K[i] === 'spot' || K[i] === 'fix' ? 'open' : '') }) });

  // Eigene Flotte
  const oOv = {};
  for (const [i, s] of Object.entries(KF)) oOv[i] = { m: s === 'sunk' ? 'hit' : s === 'spot' ? null : s, c: s };
  if (F) for (const m of F.mines) if (!oOv[m]) oOv[m] = { m: 'mine', c: 'own-mine' };
  if (S.pending && S.pending.p === foe) for (const i of SV.cellsOf(S.pending.a, n)) oOv[i] = { ...(oOv[i] || {}), c: ((oOv[i] || {}).c || '') + ' pv bad' };
  if (ui.ab === 'reparatur' && ui.i != null) oOv[ui.i] = { ...(oOv[ui.i] || {}), c: ((oOv[ui.i] || {}).c || '') + ' pv sel' };
  const oShips = F ? F.ships.map((s) => ({ ...fromCells(s.k, s.cells), id: s.id, cls: s.sunk ? 'sunk' : '' })) : [];
  const ownBoard = boardHTML({ n, id: 'mine', kind: 'own', ships: oShips, ov: oOv, locked: !(myTurn && ui.ab === 'reparatur'), zones: zonesOf(foe, 'foe') });

  // Status
  let stCls = '', stB = '', stS = '';
  if (over) { stCls = ''; stB = S.winner === me ? 'Sieg!' : S.winner == null ? 'Partie beendet' : 'Flotte verloren'; stS = S.resigned != null ? `${esc(S.players[S.resigned].name)} hat aufgegeben.` : 'Die Seeschlacht ist entschieden.'; }
  else if (S.pending && S.pending.p === me) { stCls = 'mine wait'; stB = 'Feuer!'; stS = `Warte auf Meldung von ${esc(pName)} …`; }
  else if (S.pending) { stCls = 'wait'; stB = 'Einschlag erwartet'; stS = `${esc(pName)}: ${esc(S.pending.a.ab ? SV.AB[S.pending.a.ab].n : 'Schuss')} auf ${esc(SV.nato(SV.centerOf(S.pending.a, n)))}`; }
  else if (myTurn) { stCls = 'mine'; stB = 'Du bist dran'; stS = ui.ab ? abHint(ui.ab) : 'Tippe ein Feld an, dann „Feuer!“. Doppelt tippen feuert sofort.'; }
  else { stCls = 'wait'; stB = `${esc(pName)} zielt …`; stS = ses.transport.kind === 'online' && !ses.presence.includes('p' + foe) ? `${esc(pName)} ist gerade nicht online. Der Zug kommt an, sobald die App wieder offen ist.` : 'Deine Flotte hält den Atem an.'; }

  const sunkMe = S.sunk[me].length, sunkFoe = S.sunk[foe].length, total = SV.fleetCount(st.fleet);
  const tabsMode = App.prefs.layout === 'tabs';
  const show = tabsMode ? App.ui.view || 'target' : 'both';
  const log = S.actions.slice().reverse().slice(0, ui.logAll ? 999 : 5).map((x) => { const d = SV.describe(x, S); return `<li><span class="who">${esc(x.p === me ? 'Du' : S.players[x.p].name)}</span><span class="${d.tone}">${esc(d.text)}</span></li>`; }).join('');
  const sunkIds = new Set(S.sunk[me].map((s) => s.id));

  return `<div class="wrap">
    <header class="top"><button class="ib" data-act="home" aria-label="Zur Startseite">${ICON.back}</button><span class="ttl">${ses.transport.kind === 'bot' ? 'Computer · ' + SOLO.levelName(st.level) : 'Partie ' + ses.code}</span>${connDot()}
      <button class="ib" data-act="mutetoggle" aria-label="Ton an oder aus">${App.prefs.sound || App.prefs.speech ? ICON.vol : ICON.mute}</button><button class="ib" data-act="menu" aria-label="Menü">${ICON.more}</button></header>
    ${over && App.hideEnd ? `<div class="banner"><span><b>${S.winner === me ? 'Gewonnen' : 'Verloren'}</b> · Ergebnis und Revanche</span><button class="btn pri" data-act="showend">Anzeigen</button></div>` : ''}
    <div class="vs">
      <div class="pl ${S.turn === me ? 'turn' : ''}">${flagSVG(me)}<span style="min-width:0"><span class="nm">${esc(S.players[me].name)} (du)</span><small>${sunkMe}/${total} versenkt</small></span></div>
      <span class="score">${sunkMe}:${sunkFoe}</span>
      <div class="pl r ${S.turn === foe ? 'turn' : ''}"><span style="min-width:0"><span class="nm">${esc(pName)}</span><small>${sunkFoe}/${total} versenkt</small></span>${flagSVG(foe)}</div>
    </div>
    <div class="status ${stCls}">${over ? '' : '<span class="pulse"></span>'}<span><b>${stB}</b><small>${stS}</small></span></div>
    <div class="battle ${tabsMode ? 'tabs-mode' : 'both'}" data-show="${show}">
      ${tabsMode ? `<div class="seg tabs" role="tablist"><button data-act="view" data-v="target" aria-pressed="${show === 'target'}">Zielgebiet</button><button data-act="view" data-v="own" aria-pressed="${show === 'own'}">Eigene Flotte</button></div>` : ''}
        <section class="view target"><h3>Zielgebiet <small>Flotte von ${esc(pName)}</small></h3><div class="boardbox">${targetBoard}</div>
          <div class="fleetstrip" style="margin-top:8px">${SV.instances(st.fleet).map((x) => `<button class="s ${sunkIds.has(x.id) ? 'gone' : ''}" data-act="shipinfo" data-k="${x.k}">${sil(x.k, 12)}${esc(x.label)}</button>`).join('')}</div></section>
      ${!over ? `<div class="control">
        ${st.mode === 'ab' ? `<div class="abbar" role="toolbar" aria-label="Fähigkeiten">
          <button class="abchip" data-act="ab" data-v="" aria-pressed="${!ui.ab}">${AB_ICON.shot}<b>Schuss</b><small>immer</small></button>
          ${abs.map((x) => `<button class="abchip" data-act="ab" data-v="${x.ab}" aria-pressed="${ui.ab === x.ab}" ${!x.alive || x.left <= 0 ? 'disabled' : ''}>${AB_ICON[SV.AB[x.ab].icon]}<b>${SV.AB[x.ab].n}</b><small>${!x.alive ? 'Schiff gesunken' : x.left <= 0 ? 'verbraucht' : x.left + '× übrig'}</small></button>`).join('')}
        </div>` : ''}
        ${controlArea(a, myTurn)}
      </div>` : ''}
        <section class="view own ${S.pending && S.pending.p === foe ? 'incoming' : ''}"><h3>Eigene Flotte <small>${F ? F.ships.filter((s) => !s.sunk).length : 0} von ${total} schwimmen</small></h3><div class="boardbox">${ownBoard}</div>
          ${F && F.mines.size ? `<p class="hint" style="margin-top:6px">${plural(F.mines.size, 'Mine ist', 'Minen sind')} noch scharf.</p>` : ''}</section>
      <section class="log"><div class="row" style="justify-content:space-between;padding:10px 2px 4px"><span class="eyebrow">Funkprotokoll</span>${S.actions.length > 5 ? `<button class="chip" data-act="logall">${ui.logAll ? 'Weniger' : 'Alle ' + S.actions.length}</button>` : ''}</div><ol>${log || '<li><span class="who">–</span><span class="muted">Noch kein Schuss gefallen.</span></li>'}</ol></section>
    </div></div>`;
}
function abHint(ab) {

function controlArea(a, myTurn) {

  const tgt = a ? (ab === 'schnellfeuer' ? `${SV.nato(a.i)} + ${SV.nato(a.j)}` : ab === 'radar' || ab === 'torpedo' ? (a.v ? 'Spalte ' + SV.NATO[SV.rc(a.i)[1]] : 'Reihe ' + (SV.rc(a.i)[0] + 1)) : SV.nato(SV.centerOf(a, n))) : u.i != null && ab === 'schnellfeuer' ? SV.nato(u.i) + ' + …' : 'kein Ziel';

  if (ab === 'torpedo') toggles.push(`<button class="chip" data-act="tog" data-k="rev">${u.v ? (u.rev ? 'von unten ↑' : 'von oben ↓') : (u.rev ? 'von rechts ←' : 'von links →')}</button>`);

function battleTap(boardId, i) {
  const ses = App.ses, S = ses.state, u = App.ui;
  if (S.phase !== 'battle') return;
  if (!ses.canAct()) return toast(S.pending ? 'Die Meldung ist unterwegs …' : `${esc(S.players[ses.foe].name)} ist dran.`);
  if (boardId === 'mine') {
    if (u.ab !== 'reparatur') return;
    const F = ses.fleet(), h = SV.shipAt(F, i);
    if (!h || !h[0].hit[h[1]] || h[0].sunk) return toast('Wähle ein getroffenes Feld an einem Schiff, das noch schwimmt.');
    u.i = i; render(); return;
  }
  if (u.ab === 'reparatur') return;
  const K = S.known[ses.me];
  const blk = SV.blockedCells(K, S.settings.n, S.settings.touch);
  if ((!u.ab || u.ab === 'schnellfeuer') && blk.has(i)) return toast('Dort kann kein Schiff liegen: Schiffe berühren sich nicht.');
  if (!u.ab) {
    if (K[i] && K[i] !== 'spot' && K[i] !== 'fix') return toast('Dort hast du schon geschossen.');
    if (u.i === i) return fire();
    u.i = i; Sound.play('click'); render(); return;
  }
  if (u.ab === 'schnellfeuer') {
    if (K[i] && K[i] !== 'spot' && K[i] !== 'fix') return toast('Dort hast du schon geschossen.');
    if (u.i == null || (u.j != null)) { u.i = i; u.j = null; } else if (i !== u.i) u.j = i;
    Sound.play('click'); render(); return;
  }
  if (u.i === i && u.ab !== 'radar' && u.ab !== 'torpedo') return fire();
  u.i = i; Sound.play('click'); render();
}
async function fire() {
  const a = draftAction(); if (!a) return;
  const ses = App.ses;
  const pre = { shot: 'whistle', breitseite: 'whistle', salve: 'whistle', schnellfeuer: 'whistle', luftangriff: 'plane', aufklaerung: 'plane', torpedo: 'torpedo', sonar: 'ping', radar: 'radar', wasserbomben: 'whistle', reparatur: 'fix' }[a.t];
  Sound.play(pre);
  App.ui = { view: App.ui.view, v: App.ui.v };
  try { await ses.act(a); } catch (e) { toast(esc(e.message)); }
  render();
}

/* Ansagen, Töne und Effekte für neue Meldungen */
function onSessionChange(ses, prev) {
  if (ses !== App.ses) return;
  const S = ses.state;
  if (prev) {
    // neuer Zug des Gegners kommt an
    if (S.pending && S.pending.p === ses.foe && (!prev.pending || prev.pending.n !== S.pending.n)) {
      Sound.play({ luftangriff: 'plane', aufklaerung: 'plane', torpedo: 'torpedo', sonar: 'ping', radar: 'radar' }[S.pending.a.t] || 'whistle');
      if (App.prefs.autoView && App.prefs.layout === 'tabs') App.ui.view = 'own';
    }
    for (const x of S.actions) {
      if (x.n <= ses.seenN) continue;
      ses.seenN = x.n;
      announce(ses, x);
    }
    if (prev.phase !== S.phase) {
      if (S.phase === 'setup') { App.screen = 'setup'; App.ui = {}; Sound.play('radio'); Voice.say(`${S.players[ses.foe].name} ist auf Station. Flotte aufstellen.`); }
      if (S.phase === 'battle') {
        App.screen = 'battle'; App.ui = { view: 'target' };
        const st = S.starter === ses.me ? 'Du hast den ersten Schuss.' : `${S.players[S.starter].name} hat den ersten Schuss.`;
        Voice.say(`Alle Mann auf Gefechtsstation. ${st}`); toast(esc(st));
      }
      if (S.phase === 'over') {
        App.screen = App.screen === 'lobby' ? 'home' : 'battle';
        App.hideEnd = false;
        setTimeout(() => { Sound.play(S.winner === ses.me ? 'win' : 'lose'); if (S.resigned != null) Voice.say(`${S.players[S.resigned].name} hat aufgegeben.`); }, 1600);
        setTimeout(() => { if (App.ses === ses) showEnd(); }, S.resigned != null ? 300 : 2600);
      }
    }
    if (S.next && (!prev.next) && S.next.p !== ses.me) { Voice.say(`${S.players[S.next.p].name} will eine Revanche.`); if ($('.endcard')) showEnd(); }
    if (S.reveals.some(Boolean) && $('.endcard')) showEnd();
    if (S.saved && !prev.saved && $('.endcard')) showEnd();
  }
  if (S.phase === 'over') { if (ses.transport.kind === 'bot') submitCpu(ses); else maybeSave(ses); }
  if (App.screen === 'lobby' && S.phase !== 'lobby') App.screen = S.phase === 'over' ? 'home' : S.phase;
  if (!Drag.d) render();
}
function announce(ses, x) {
  const S = ses.state, d = SV.describe(x, S);
  const delay = { luftangriff: 900, aufklaerung: 900, torpedo: 800, sonar: 300 }[x.a.t] || 120;
  const now = Date.now();
  for (const c of x.r.cells || []) App.fx[c.i] = { t: now + delay, s: c.s };
  for (const s of x.r.sunk || []) for (const i of s.cells) App.fx[i] = { t: now + delay, s: 'hit' };
  setTimeout(() => {
    if (x.r.skip) Sound.play('mine');
    else if (x.r.sunk) Sound.play('sunk');
    else if ((x.r.cells || []).some((c) => c.s === 'hit')) Sound.play('boom');
    else if (x.a.t === 'reparatur') Sound.play('fix');
    else if (SV.AB[x.a.ab]?.kind === 'intel') Sound.play(x.a.t === 'sonar' ? 'ping' : 'radar');
    else Sound.play('splash');
    if (x.p === ses.foe && App.prefs.vibrate && (x.r.cells || []).some((c) => c.s === 'hit')) navigator.vibrate?.(x.r.sunk ? [120, 60, 220] : 90);
    Voice.say(d.say);
    if (!Drag.d) render();
  }, delay);
  if (x.r.skip) setTimeout(() => toast(`<b>Mine!</b> ${esc(x.p === ses.me ? 'Du setzt' : S.players[x.p].name + ' setzt')} eine Runde aus.`), delay + 300);
  // Ansicht wechseln
  if (App.prefs.layout === 'tabs' && App.prefs.autoView && S.phase === 'battle') {
    if (x.p === ses.me) App.ui.view = x.self ? 'own' : 'target';
    if (x.p === ses.foe) { App.ui.view = 'own'; clearTimeout(App.viewT); App.viewT = setTimeout(() => { if (App.ses === ses && ses.state.turn === ses.me && !ses.state.pending) { App.ui.view = 'target'; render(); } }, 2300); }
  }
  if (x.self && x.p === ses.me && App.prefs.layout === 'tabs') setTimeout(() => { if (App.ses === ses) { App.ui.view = 'target'; render(); } }, 1600);
}

/* ---------- Ende ---------- */
async function showEnd() {
  const ses = App.ses, S = ses.state, me = ses.me, foe = ses.foe;
  if (S.phase !== 'over') return;
  const hits = (p) => S.actions.filter((x) => x.p === p && !x.self).reduce((a, x) => a + (x.r.cells || []).filter((c) => c.s === 'hit').length, 0);
  const total = SV.fleetCount(S.settings.fleet);
  const win = S.winner === me;
  const vFoe = S.reveals[foe] ? await SV.verify(S, foe) : null;
  const vMe = S.reveals[me] ? await SV.verify(S, me) : null;
  if (App.ses !== ses) return;
  const kg = saveStatus(ses);
  const nextOffer = S.next && S.next.p !== me;
  const html = `<div class="endcard">
    <span class="eyebrow">${S.resigned != null ? (S.resigned === me ? 'Du hast aufgegeben' : esc(S.players[S.resigned].name) + ' hat aufgegeben') : 'Seeschlacht entschieden'}</span>
    <div class="big ${win ? 'win' : 'lose'}">${win ? 'Sieg!' : S.winner == null ? 'Abgebrochen' : 'Versenkt.'}</div>
    <p style="margin:0">${win ? `Die Flotte von ${esc(S.players[foe].name)} liegt auf dem Meeresgrund.` : S.winner == null ? 'Diese Partie hat keinen Sieger.' : `${esc(S.players[foe].name)} hat die Seeschlacht gewonnen.`}</p>
    <div class="stats">
      <div class="h">Du</div>
      <div><b>${S.shots[me]}</b><small>Schüsse</small></div><div><b>${pct(S.shots[me] ? hits(me) / S.shots[me] : null)}</b><small>Trefferquote</small></div>
      <div><b>${S.sunk[me].length}/${total}</b><small>Schiffe versenkt</small></div><div><b>${S.sunk[foe].length}/${total}</b><small>Schiffe verloren</small></div>
      <div class="h">${esc(S.players[foe].name)}</div>
      <div><b>${S.shots[foe]}</b><small>Schüsse</small></div><div><b>${pct(S.shots[foe] ? hits(foe) / S.shots[foe] : null)}</b><small>Trefferquote</small></div>
    </div>
    <div class="panel stack" style="text-align:left;gap:8px"><span class="eyebrow">Fairness-Check</span>
      ${checkLine(vFoe, `Flotte von ${S.players[foe].name}`)}${checkLine(vMe, 'Deine Flotte')}
      <p class="hint">Vor dem ersten Schuss hat jedes Gerät eine Prüfsumme seiner Aufstellung geschickt. Jetzt werden beide Flotten aufgedeckt und mit jeder Meldung verglichen.</p></div>
    ${kg}
    ${nextOffer ? `<button class="btn pri block" data-act="acceptnext">Revanche von ${esc(S.players[S.next.p].name)} annehmen</button>` : `<button class="btn pri block" data-act="rematch">${S.next ? 'Revanche angefragt …' : 'Revanche'}</button>`}
    <div class="row"><button class="btn" data-act="hideend">Spielfeld ansehen</button><button class="btn" data-act="home">Startseite</button></div>
  </div>`;
  const el = sheet(html, { onClose: () => { App.hideEnd = true; render(); } });
  el.addEventListener('change', (e) => { const s = e.target.closest('[data-kgpick]'); if (s) App.ui['kg' + s.dataset.kgpick] = s.value; });
}
function checkLine(v, who) {
  if (!v) return `<div class="check"><span class="c">…</span><span>${esc(who)}: wird aufgedeckt …</span></div>`;
  return `<div class="check"><span class="c ${v.ok ? 'ok' : 'bad'}">${v.ok ? '✓' : '!'}</span><span><b>${esc(who)}:</b> ${esc(v.ok ? 'passt zu allen Meldungen.' : v.msg)}</span></div>`;
}

/* ---------- KahloGames speichern ---------- */
function saverOf(S) { return S.players[0].kg ? 0 : S.players[1].kg ? 1 : null; }
function kgIds(ses) {
  const S = ses.state, list = KG.cachedPlayers();
  const byName = (nm) => list.find((x) => x.name.trim().toLowerCase() === String(nm || '').trim().toLowerCase())?.id || null;
  return [0, 1].map((p) => S.players[p].kgId || App.ui['kg' + p] || byName(S.players[p].name));
}
function saveStatus(ses) {
  const S = ses.state;
  if (ses.transport.kind === 'bot') return S.actions.length ? soloStatus(ses.qid) : '<p class="hint">Ohne Schuss beendet: wird nicht gewertet.</p>';
  if (ses.transport.kind === 'tabs') return '<p class="hint">Testpartie im Browser: wird nicht an KahloGames geschickt.</p>';
  if (S.saved) return `<div class="check"><span class="c ok">✓</span><span>In KahloGames gespeichert.</span></div>`;
  if (App.saving === ses.code) return '<div class="check"><span class="c">…</span><span>Wird in KahloGames gespeichert …</span></div>';
  const saver = saverOf(S);
  if (saver != null && saver !== ses.me) return `<div class="check"><span class="c">…</span><span>Das Gerät von ${esc(S.players[saver].name)} speichert die Partie in KahloGames.</span></div>`;
  if (!KG.connected()) return `<div class="notice">Nicht mit KahloGames verbunden. <button class="chip" data-act="settings">Jetzt verbinden</button> und danach hier speichern.</div>`;
  const ids = kgIds(ses), list = KG.cachedPlayers();
  const pick = (p) => ids[p] ? '' : `<div class="field"><label for="kg${p}">Wer war ${p === ses.me ? 'du' : esc(S.players[p].name)} in KahloGames?</label><select id="kg${p}" data-kgpick="${p}"><option value="">Bitte wählen</option>${list.map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></div>`;
  return `<div class="panel stack" style="text-align:left;gap:10px"><span class="eyebrow">KahloGames</span>${App.saveErr ? `<p class="warn" style="margin:0">${esc(App.saveErr)}</p>` : ''}${pick(0)}${pick(1)}<button class="btn block" data-act="kgsave">In KahloGames speichern</button></div>`;
}
async function maybeSave(ses, manual = false) {
  const S = ses.state;
  if (ses.transport.kind !== 'online' || S.saved || App.saving === ses.code || !KG.connected()) return;
  if (S.winner == null || !S.actions.length) return;
  if (!manual && saverOf(S) !== ses.me) return;
  if (!manual && App.saveTried?.[ses.code]) return;
  const ids = kgIds(ses);
  if (!ids[0] || !ids[1]) return;
  if (ids[0] === ids[1]) { App.saveErr = 'Beide Seiten sind derselbe KahloGames-Spieler.'; return; }
  (App.saveTried ||= {})[ses.code] = true;
  App.saving = ses.code; App.saveErr = null; if ($('.endcard')) showEnd();
  try {
    await ses.refresh();
    if (ses.state.saved) return;
    const m = await KG.save(ses.state, ids);
    await ses.post('saved', { id: m?.id || null });
    toast('<b>Gespeichert.</b> Die Partie steht jetzt in KahloGames.');
  } catch (e) { App.saveErr = e.message; }
  finally { App.saving = null; if ($('.endcard')) showEnd(); }
}

/* ============================================================
   Regeln
   ============================================================ */
function viewRules() {
  return `<div class="wrap">
    <header class="top"><button class="ib" data-act="back" aria-label="Zurück">${ICON.back}</button><span class="ttl">Regeln & Fähigkeiten</span></header>
    <div class="rules">
      <section class="narrow" style="margin:0"><h2>So läuft eine Partie</h2>
        <ol><li>Einer eröffnet eine Partie und schickt den Code. Der andere tritt bei, egal wo er ist.</li>
        <li>Beide stellen ihre Flotte verdeckt auf. Jedes Gerät schickt dabei nur eine Prüfsumme, die Aufstellung bleibt geheim.</li>
        <li>Wer anfängt, entscheidet das Los. Abwechselnd wird geschossen. Die Funkstimme sagt jeden Schuss an, zum Beispiel „Charlie fünf. Ziel getroffen. Kreuzer versenkt.“</li>
        <li>Wer zuerst alle gegnerischen Schiffe versenkt, gewinnt. Danach werden beide Flotten aufgedeckt und geprüft. Das Ergebnis geht an KahloGames.</li></ol>
      </section>
      <section class="narrow" style="margin:0"><h2>Klassisch</h2>
        <ul><li>Pro Zug ein Schuss auf ein Feld. Die Meldung lautet „Ziel verfehlt“, „Ziel getroffen“ oder „versenkt“, sobald alle Felder eines Schiffs getroffen sind.</li>
        <li>Wer trifft, darf nochmal schießen, wenn das bei der Partie eingestellt ist.</li>
        <li>Schiffe liegen waagerecht oder senkrecht. Normalerweise dürfen sie sich nicht berühren, auch nicht über Eck. Dann schraffiert die App alle Felder, auf denen kein Schiff mehr liegen kann: schräg neben jedem Treffer und rund um versenkte Schiffe.</li></ul>
      </section>
      <section class="narrow" style="margin:0"><h2>Mit Fähigkeiten</h2>
        <ul><li>Jedes Schiff bringt seine Fähigkeit mit. Welche es gibt, hängt also von der Flotte ab, die ihr einstellt.</li>
        <li>Statt eines normalen Schusses darfst du eine Fähigkeit einsetzen. Danach ist dein Zug immer vorbei, auch bei einem Treffer.</li>
        <li>Eine Fähigkeit wirkt nur, solange ihr Schiff schwimmt. Wird es versenkt, ist sie weg. Gefährliche Schiffe zuerst zu jagen lohnt sich also.</li>
        <li>Sonar, Radar, Aufklärung und Wasserbomben bleiben als gestrichelter Bereich auf dem Spielfeld, mit der gemeldeten Zahl in der Ecke. Rote Bereiche auf deiner eigenen Flotte zeigen, wo der Gegner gesucht hat.</li>
        <li>Gelbe Rauten sind gesichtete Schiffsteile, ein grüner Schraubenschlüssel ein repariertes Feld, eine Mine mit Stacheln eine getroffene Seemine.</li></ul>
      </section>
      <section class="narrow" style="margin:0"><h2>Einzelspieler</h2>
        <ul><li><b>Gegen den Computer:</b> wie ein Duell, nur gegen den Computer. Leicht schießt meist ins Blaue, Mittel sucht im Schachbrettmuster und verfolgt Treffer, Schwer rechnet für jedes Feld die Wahrscheinlichkeit aus. Eine Partie kann man unterbrechen und später weiterspielen.</li>
        <li><b>Flottenjagd:</b> Nur du schießt. Jeder Schuss und jede Fähigkeit ist ein Zug. Eine Mine kostet 3 Strafzüge. Punkte = 100 × (Schüsse, die man blind im Schnitt bräuchte) ÷ deine Züge. Bei der <b>Tagesmission</b> liegt bei allen dieselbe Flotte, und nur der erste Versuch des Tages zählt.</li>
        <li><b>Letzte Granate:</b> ${SOLO.W.start} Granaten, endlose Wellen. Versenkte Schiffe bringen Länge + ${SOLO.W.ship(0)} Granaten, eine geschaffte Welle +${SOLO.W.wave}, eine Versorgungskiste im Wasser +${SOLO.W.crate}. Gewertet werden die versenkten Schiffe.</li>
        <li>Alle Ergebnisse gehen an KahloGames in den Bereich <b>Einzelspieler</b> bei Schiffe versenken. Ohne Verbindung werden sie auf dem Gerät vorgemerkt und später nachgetragen.</li></ul>
      </section>
      <section><h2>Die Schiffe</h2><div class="catalog">${SV.SHIPS.map((s) => `<article class="card"><div class="hd"><b>${esc(s.n)}</b><small>${s.len} Felder</small></div>${sil(s.k, 22)}
        ${s.ab.map((x) => abBlock(x)).join('')}

        ${!s.ab.length && !s.passive ? '<p class="hint">Keine Fähigkeit.</p>' : ''}</article>`).join('')}</div></section>
      <section class="narrow" style="margin:0"><h2>NATO-Alphabet</h2><p class="muted">Die Spalten heißen nach dem NATO-Alphabet, die Zeilen sind nummeriert. „Delta sieben“ ist also Spalte D, Zeile 7.</p>
        <div class="natotab">${SV.NATO.map((w, c) => `<span><b>${SV.letter(c)}</b>${w}</span>`).join('')}</div></section>
    </div></div>`;
}

function readPrefs() {

function render() {
  const app = $('#app');

  let html = '';
  if (App.screen === 'home') html = viewHome();
  else if (App.screen === 'config') html = viewConfig();
  else if (App.screen === 'rules') html = viewRules();
  else if (App.hunt && App.screen === 'hunt') html = viewHunt();
  else if (App.ses && App.screen === 'lobby') html = viewLobby();
  else if (App.ses && App.screen === 'setup') html = viewSetup();
  else if (App.ses && App.screen === 'battle') html = viewBattle();
  else { App.screen = 'home'; html = viewHome(); }
  const changed = app.dataset.screen !== App.screen;
  app.innerHTML = html; app.dataset.screen = App.screen;
  if (changed) window.scrollTo(0, 0); else window.scrollTo(0, scroll);
  if (App.screen === 'lobby') drawQR();
}

function guardHunt(then) {
  const h = App.huntSaved;
  if (!h || h.over || (!h.moves && !h.n)) return then();
  sheet(`<div class="stack"><h2>Laufende Jagd</h2><p class="muted" style="margin:0">${h.kind === 'wellen' ? 'Deine Partie Letzte Granate' : h.daily && h.counted ? 'Deine Tagesmission' : 'Deine Flottenjagd'} läuft noch. ${h.kind === 'wellen' ? 'Brichst du ab, zählt dein bisheriges Ergebnis.' : h.daily && h.counted ? 'Brichst du ab, ist die Tagesmission für heute verbraucht.' : 'Sie wird ohne Wertung beendet.'}</p>
    <div class="row"><button class="btn pri" data-act="resumehunt">Weiterspielen</button><button class="btn" data-act="abandonhunt">Abbrechen und neu</button></div></div>`);
  App.afterAbandon = then;
}

/* ---------- Ansicht ---------- */
function viewHunt() {
  const h = App.hunt, n = h.settings.n, K = h.K, ui = App.ui, jagd = h.kind === 'jagd';
  const a = draftAction(), pv = a ? new Set(SV.cellsOf(a, n)) : new Set();
  const ov = {};
  for (const [i, s] of Object.entries(K)) ov[i] = { m: s === 'sunk' ? 'hit' : s, c: s };
  const ships = h.sunkNow.map((s) => ({ ...fromCells(s.k, s.cells), cls: 'sunk wreck' }));
  if (h.over && h.result !== 'done') {
    const ids = new Set(h.sunkNow.map((s) => s.id));
    for (const s of h.setup.fleet) if (!ids.has(s.id)) ships.push({ ...s, cls: 'reveal' });
    for (const m of h.setup.mines || []) if (!K[m]) ov[m] = { m: 'mine', c: 'reveal' };
    for (const c of h.crateCells || []) if (!K[c]) ov[c] = { m: 'crate', c: 'reveal' };
  }
  if (h.canAct()) {
    for (const i of pv) { const ex = ov[i] || {}; ov[i] = { ...ex, c: (ex.c || '') + (ui.ab === 'torpedo' ? ' trail' : ' pv') }; }
    if (ui.i != null) { const ex = ov[ui.i] || {}; ov[ui.i] = { ...ex, c: (ex.c || '') + ' pv sel' }; }
  }
  const blk = h.over ? null : SV.blockedCells(K, n, h.settings.touch);
  const board = boardHTML({ n, id: 'tgt', kind: 'target', ships, ov, locked: !h.canAct(), zones: h.zones || [], blocked: blk, cell: (i) => ({ c: (K[i] === 'sunk' ? 'ks ' : '') + (!K[i] || K[i] === 'spot' ? 'open' : '') }) });
  const total = SV.fleetCount(h.settings.fleet), sunkIds = new Set(h.sunkNow.map((s) => s.id));
  const acc = h.shots ? h.hits / h.shots : null;
  const bar = jagd
    ? `<div class="hbar"><div><b>${h.moves}</b><small>${h.moves === 1 ? 'Zug' : 'Züge'}${h.penalties ? ` (+${h.penalties} Strafe)` : ''}</small></div><div><b>${pct(acc)}</b><small>Trefferquote</small></div><div><b>${h.sunkNow.length}/${total}</b><small>versenkt</small></div></div>`
    : `<div class="hbar"><div class="ammo ${h.ammo <= 10 ? 'low' : ''}"><b>${h.ammo}</b><small>Granaten</small></div><div><b>${h.wave + 1}</b><small>Welle</small></div><div><b>${h.sunkTotal}</b><small>Schiffe versenkt</small></div></div>`;
  const title = jagd ? (h.daily ? `Tagesmission ${fmtDay(h.daily)}` : 'Flottenjagd') : 'Letzte Granate';
  let stB, stS, stCls = 'mine';
  if (h.over) { stCls = ''; stB = h.result === 'done' ? 'Flotte versenkt' : h.result === 'empty' ? 'Munition leer' : 'Abgebrochen'; stS = jagd ? (h.result === 'done' ? `${plural(h.moves, 'Zug', 'Züge')} · ${h.score} Punkte` : 'Die restlichen Schiffe sind aufgedeckt.') : `${plural(h.sunkTotal, 'Schiff', 'Schiffe')} versenkt, Welle ${h.wave + 1} erreicht.`; }
  else if (h.busy) { stCls = 'wait'; stB = `Welle ${h.wave} geschafft`; stS = 'Die nächste Feindflotte läuft ein …'; }
  else { stB = ui.ab ? SV.AB[ui.ab].n : jagd ? 'Feuer frei' : h.ammo <= 5 ? 'Letzte Granaten!' : 'Feuer frei'; stS = ui.ab ? abHint(ui.ab) : 'Tippe ein Feld an, dann „Feuer!“. Doppelt tippen feuert sofort.'; }
  const pseudo = { settings: h.settings, players: [{ name: 'Du' }, { name: 'Feind' }] };
  const log = h.log.slice(0, ui.logAll ? 60 : 5).map((x) => { const d = huntText(x, pseudo); return `<li><span class="who">${x.wave != null && !jagd ? 'W' + (x.wave + 1) : 'Zug ' + (x.n + 1)}</span><span class="${d.tone}">${esc(d.text)}</span></li>`; }).join('');
  const abs = h.abilities();
  return `<div class="wrap">
    <header class="top"><button class="ib" data-act="home" aria-label="Zur Startseite">${ICON.back}</button><span class="ttl">${esc(title)}</span>
      <button class="ib" data-act="mutetoggle" aria-label="Ton an oder aus">${App.prefs.sound || App.prefs.speech ? ICON.vol : ICON.mute}</button><button class="ib" data-act="huntmenu" aria-label="Menü">${ICON.more}</button></header>
    ${h.over && App.hideEnd ? `<div class="banner"><span><b>${esc(stB)}</b> · Ergebnis</span><button class="btn pri" data-act="huntend">Anzeigen</button></div>` : ''}
    <div class="hunt-grid">
      <div class="stack" style="gap:10px">
        ${bar}
        <div class="status ${stCls}">${h.over ? '' : '<span class="pulse"></span>'}<span><b>${esc(stB)}</b><small>${esc(stS)}</small></span></div>
        <div class="boardbox">${board}</div>
        <div class="fleetstrip">${SV.instances(h.settings.fleet).map((x) => `<button class="s ${sunkIds.has(x.id) ? 'gone' : ''}" data-act="shipinfo" data-k="${x.k}">${sil(x.k, 12)}${esc(x.label)}</button>`).join('')}</div>
      </div>
      <div class="stack" style="gap:12px;align-content:start">
        ${!h.over ? `<div class="control">
          ${abs.length ? `<div class="abbar" role="toolbar" aria-label="Fähigkeiten"><button class="abchip" data-act="ab" data-v="" aria-pressed="${!ui.ab}">${AB_ICON.shot}<b>Schuss</b><small>immer</small></button>
            ${abs.map((x) => `<button class="abchip" data-act="ab" data-v="${x.ab}" aria-pressed="${ui.ab === x.ab}" ${x.left <= 0 ? 'disabled' : ''}>${AB_ICON[SV.AB[x.ab].icon]}<b>${SV.AB[x.ab].n}</b><small>${x.left <= 0 ? 'verbraucht' : x.left + '× übrig'}</small></button>`).join('')}</div>` : ''}
          ${controlArea(a, h.canAct())}
        </div>` : `<button class="btn pri block" data-act="huntagain" style="min-height:52px">Nochmal</button>`}
        <section class="log"><div class="row" style="justify-content:space-between;padding:10px 2px 4px"><span class="eyebrow">Funkprotokoll</span>${h.log.length > 5 ? `<button class="chip" data-act="logall">${ui.logAll ? 'Weniger' : 'Mehr'}</button>` : ''}</div><ol>${log || '<li><span class="who">–</span><span class="muted">Noch kein Schuss gefallen.</span></li>'}</ol></section>
      </div>
    </div></div>`;
}

/* Text und Ansage zu einem Zug der Jagd */
function huntText(x, pseudo) {
  const r = { ...x.r, over: false, skip: false };
  const d = SV.describe({ ...x, p: 0, r }, pseudo);
  let text = d.text, say = d.say, tone = d.tone;
  if (x.r.skip) { text += ' Mine! 3 Züge Strafe.'; say += ' Mine! Drei Züge Strafe.'; tone = 'mine'; }
  if (x.crate) { text += ` Versorgungskiste: +${SOLO.W.crate} Granaten.`; say += ` Versorgungskiste geborgen. Plus ${SV.NUM[SOLO.W.crate]} Granaten.`; tone = 'intel'; }
  const shipGain = x.gain - (x.crate ? SOLO.W.crate : 0) - (x.waveDone ? SOLO.W.wave : 0);
  if (shipGain > 0) text += ` +${shipGain} Granaten.`;
  if (x.waveDone) { text += ` Welle ${x.waveDone} geschafft.`; say += ` Welle ${SV.NUM[x.waveDone] || x.waveDone} geschafft.`; }
  if (x.r.over && !x.waveDone) { say += ' Flotte vernichtet.'; text += ' Flotte vernichtet.'; }
  return { text, say, tone };
}

/* ---------- Bedienung ---------- */
function huntTap(i) {
  const h = App.hunt, u = App.ui;
  if (!h.canAct()) return;
  const K = h.K, done = (j) => K[j] && K[j] !== 'spot';
  if ((!u.ab || u.ab === 'schnellfeuer') && SV.blockedCells(K, h.settings.n, h.settings.touch).has(i)) return toast('Dort kann kein Schiff liegen: Schiffe berühren sich nicht.');
  if (!u.ab) {
    if (done(i)) return toast('Dort hast du schon geschossen.');
    if (u.i === i) return huntFire();
    u.i = i; Sound.play('click'); render(); return;
  }
  if (u.ab === 'schnellfeuer') {
    if (done(i)) return toast('Dort hast du schon geschossen.');
    if (u.i == null || u.j != null) { u.i = i; u.j = null; } else if (i !== u.i) u.j = i;
    Sound.play('click'); render(); return;
  }
  if (u.i === i && u.ab !== 'radar' && u.ab !== 'torpedo') return huntFire();
  u.i = i; Sound.play('click'); render();
}
function huntFire() {
  const h = App.hunt, a = draftAction(); if (!a || !h.canAct()) return;
  if (a.ab) a.ship = 'jagd';
  Sound.play({ luftangriff: 'plane', aufklaerung: 'plane', torpedo: 'torpedo', sonar: 'ping', radar: 'radar' }[a.t] || 'whistle');
  App.ui = { v: App.ui.v };
  const x = h.act(a);
  if (!x) return render();
  const delay = { luftangriff: 900, aufklaerung: 900, torpedo: 800, sonar: 300 }[a.t] || 120, now = Date.now();
  for (const c of x.r.cells || []) App.fx[c.i] = { t: now + delay, s: c.s };
  for (const s of x.r.sunk || []) for (const i of s.cells) App.fx[i] = { t: now + delay, s: 'hit' };
  const d = huntText(x, { settings: h.settings, players: [{ name: 'Du' }, { name: 'Feind' }] });
  setTimeout(() => {
    if (x.r.skip) Sound.play('mine');
    else if (x.r.sunk) Sound.play('sunk');
    else if ((x.r.cells || []).some((c) => c.s === 'hit')) Sound.play('boom');
    else if (SV.AB[a.ab]?.kind === 'intel') Sound.play(a.t === 'sonar' ? 'ping' : 'radar');
    else Sound.play('splash');
    if (x.crate) setTimeout(() => Sound.play('fix'), 250);
    Voice.say(d.say);
    if (App.hunt === h) render();
  }, delay);
  if (x.crate) toast(`<b>Versorgungskiste!</b> +${SOLO.W.crate} Granaten`);
  if (x.waveDone) setTimeout(() => {
    if (App.hunt !== h) return;
    h.nextWave(); App.fx = {}; render();
    Voice.say(`Neue Feindflotte gesichtet. Welle ${SV.NUM[h.wave + 1] || h.wave + 1}.`);
    toast(`<b>Welle ${h.wave + 1}</b> läuft ein`);
  }, 2600);
  if (h.over) finishHunt(h, delay);
  render();
}
async function finishHunt(h, delay = 0) {
  if (h.finished) return; h.finished = true;
  SOLO.noteRecord(h);
  if (h.result === 'aufgegeben' && h.daily && h.counted) { const R = SOLO.rec(); R.daily[h.daily] = 'aufgegeben'; LS.set('sv.records', R); }
  const counts = h.counted && (h.kind === 'wellen' ? h.n > 0 : h.result === 'done');
  if (counts && !h.qid) { h.qid = SOLO.Q.add(SOLO.huntMatch(h, KG.connected() && App.prefs.kgId ? App.prefs.kgId : '', App.prefs.name || 'Kapitän')); h.save(); }
  setTimeout(() => {
    if (App.hunt !== h) return;
    Sound.play(h.result === 'done' || (h.kind === 'wellen' && h.sunkTotal) ? 'win' : 'lose');
    if (h.kind === 'wellen' && h.result === 'empty') Voice.say(`Munition verschossen. ${SV.NUM[h.sunkTotal] && h.sunkTotal <= 12 ? SV.NUM[h.sunkTotal] : h.sunkTotal} Schiffe versenkt.`);
    App.hideEnd = false; showHuntEnd();
  }, delay + 1700);
  if (counts) { await flushSaves(); if (App.hunt === h && $('.endcard')) showHuntEnd(); }
}
async function flushSaves() { if (!SOLO.Q.all().length || !(KG.connected() && App.prefs.kgId)) return; App.flushing = true; try { await SOLO.Q.flush(); } catch {} App.flushing = false; }

function soloStatus(qid, counted = true) {
  if (!counted) return '<p class="hint">Training: wird nicht gewertet.</p>';
  if (!qid) return '';
  if (!SOLO.Q.has(qid)) return '<div class="check"><span class="c ok">✓</span><span>In KahloGames gespeichert.</span></div>';
  if (!KG.url) return '<p class="hint">KahloGames ist in config.js nicht eingetragen. Das Ergebnis bleibt auf diesem Gerät.</p>';
  if (!(KG.connected() && App.prefs.kgId)) return '<div class="notice" style="text-align:left">Noch nicht in KahloGames. Verbinde dich und wähle deinen Spieler, dann wird das Ergebnis nachgetragen. <button class="chip" data-act="settings">Verbinden</button></div>';
  if (App.flushing) return '<div class="check"><span class="c">…</span><span>Wird in KahloGames gespeichert …</span></div>';
  return '<div class="notice" style="text-align:left">Speichern hat nicht geklappt. <button class="chip" data-act="retrysave">Nochmal versuchen</button></div>';
}

function showHuntEnd() {
  const h = App.hunt; if (!h?.over) return;
  const jagd = h.kind === 'jagd', acc = h.shots ? h.hits / h.shots : null;
  let head, big, cls, sub, stats;
  if (jagd) {
    const blind = Math.round(SOLO.blindShots(h.settings));
    head = h.daily ? `Tagesmission ${fmtDay(h.daily)}${h.counted ? '' : ' · Training'}` : `Flottenjagd · ${h.settings.n}×${h.settings.n} · ${h.settings.mode === 'ab' ? 'Mit Fähigkeiten' : 'Klassisch'}`;
    if (h.result === 'done') { big = plural(h.moves, 'Zug', 'Züge'); cls = 'win'; sub = `Alle ${SV.fleetCount(h.settings.fleet)} Schiffe versenkt.${h.record ? ' <b>Neuer persönlicher Rekord!</b>' : ''}`; }
    else { big = 'Abgebrochen'; cls = 'lose'; sub = 'Die restliche Flotte ist jetzt aufgedeckt.'; }
    stats = `<div><b>${h.result === 'done' ? h.score : '–'}</b><small>Punkte</small></div><div><b>${pct(acc)}</b><small>Trefferquote</small></div>
      <div><b>${h.shots}</b><small>Schüsse insgesamt</small></div><div><b>${blind}</b><small>Schüsse bräuchte man blind</small></div>
      ${h.penalties ? `<div><b>+${h.penalties}</b><small>Strafzüge durch Minen</small></div><div><b>${Object.values(h.used).reduce((a, b) => a + b, 0)}</b><small>Fähigkeiten eingesetzt</small></div>` : ''}`;
  } else {
    head = 'Letzte Granate'; big = plural(h.sunkTotal, 'Schiff', 'Schiffe'); cls = h.sunkTotal ? 'win' : 'lose';
    sub = `${h.result === 'empty' ? 'Die Munition ist verschossen.' : 'Abgebrochen.'} Du hast Welle ${h.wave + 1} erreicht.${h.record && h.sunkTotal ? ' <b>Neuer persönlicher Rekord!</b>' : ''}`;
    stats = `<div><b>${h.wave}</b><small>${h.wave === 1 ? 'Welle' : 'Wellen'} geschafft</small></div><div><b>${pct(acc)}</b><small>Trefferquote</small></div>
      <div><b>${h.shots}</b><small>Granaten verschossen</small></div><div><b>${h.crates}</b><small>Versorgungskisten</small></div>`;
  }
  sheet(`<div class="endcard"><span class="eyebrow">${esc(head)}</span><div class="big ${cls}">${big}</div><p style="margin:0">${sub}</p>
    <div class="stats">${stats}</div>
    ${soloStatus(h.qid, h.counted && (jagd ? h.result === 'done' : h.n > 0))}
    <button class="btn pri block" data-act="huntagain">Nochmal</button>
    <div class="row"><button class="btn" data-act="hideend">Spielfeld ansehen</button><button class="btn" data-act="home">Startseite</button></div></div>`, { onClose: () => { App.hideEnd = true; render(); } });
}

/* ---------- Gegen den Computer: Ergebnis ---------- */
async function submitCpu(ses) {
  const S = ses.state;
  if (ses.submitted) return; ses.submitted = true;
  ses.bus?.forget();
  App.botSaved = null;
  if (!S.actions.length) return;
  SOLO.noteCpu(S.settings.level || 'mittel', S.winner === 0);
  ses.qid = SOLO.Q.add(SOLO.cpuMatch(S, KG.connected() && App.prefs.kgId ? App.prefs.kgId : '', App.prefs.name || 'Kapitän'));
  await flushSaves();
  if (App.ses === ses && $('.endcard')) showEnd();
}

/* ---------- Aktionen ---------- */
const SOLO_ACT = {
  daily: () => guardHunt(() => {
    const done = SOLO.dailyDone() != null;
    startHunt(SOLO.Hunt.jagd({ ...SOLO.DAILY, fleet: { ...SOLO.DAILY.fleet } }, { daily: SOLO.today(), counted: !done }));
  }),
  freejagd: () => {
    closeSheet(); App.cfgKind = 'jagd';
    App.cfg = structuredClone(LS.get('sv.lastJagd', { mode: 'classic', n: 10, fleet: { ...SV.PRESETS[0].fleet }, touch: false, again: false }));
    checkFits(); App.screen = 'config'; render();
  },
  startwellen: () => guardHunt(() => startHunt(SOLO.Hunt.wellen())),
  resumehunt: () => { closeSheet(); const h = App.huntSaved; if (!h) return; startHunt(h); if (h.busy) setTimeout(() => { h.nextWave(); render(); }, 400); if (h.over) setTimeout(showHuntEnd, 300); },
  abandonhunt: () => { const h = App.huntSaved; if (h && !h.over) { h.giveUp(); finishHunt(h, 0); } App.hunt = null; closeSheet(); const t = App.afterAbandon; App.afterAbandon = null; t?.(); },
  resumebot: (b) => run(async () => { const ses = await resumeBot(); if (!ses) { App.botSaved = null; render(); return toast('Diese Partie ist schon beendet.'); } enter(ses); }, b),
  abandonbot: (b) => run(async () => {
    closeSheet();
    const ses = await resumeBot();
    if (ses) { await ses.resign(); await sleep(50); submitCpu(ses); ses.stop(); ses.botPeer?.stop(); }
    App.botSaved = null; const t = App.afterAbandon; App.afterAbandon = null; t?.();
  }, b),
  huntmenu: () => sheet(`<div class="stack"><h2>Menü</h2>
    <button class="btn block" data-act="rules">Regeln & Fähigkeiten</button>
    <button class="btn block" data-act="settings">Einstellungen</button>
    ${!App.hunt.over ? `<button class="btn block" data-act="huntgiveup" style="border-color:var(--hit);color:var(--hit)">${App.hunt.kind === 'wellen' ? 'Beenden und werten' : 'Aufgeben'}</button>` : ''}
    <button class="btn ghost block" data-act="close">Schließen</button></div>`),
  huntgiveup: () => { const h = App.hunt; closeSheet(); h.giveUp(); finishHunt(h, 0); render(); },
  huntend: () => { App.hideEnd = false; showHuntEnd(); },
  huntagain: () => {
    const h = App.hunt; closeSheet();
    if (h.kind === 'wellen') return startHunt(SOLO.Hunt.wellen());
    if (h.daily) return SOLO_ACT.freejagd();
    startHunt(SOLO.Hunt.jagd(structuredClone(h.settings)));
  },
  retrysave: async () => { await flushSaves(); if (App.screen === 'hunt') showHuntEnd(); else if (App.ses) showEnd(); },
};

/* ---------- Start ---------- */
(function boot() {
  Object.assign(ACT, SOLO_ACT);
  refreshSaved();
  flushSaves();
  const q = new URLSearchParams(location.search);
  const code = q.get('spiel') || q.get('code') || (location.hash.length === 5 ? location.hash.slice(1) : '');
  render();
  if (KG.connected() && !KG.cachedPlayers().length) KG.players().catch(() => {});
  if (code) {
    if (Games.get(code.toUpperCase())) run(async () => enter(await openGame(code, profile())));
    else joinCode(code);
    try { history.replaceState(null, '', location.pathname); } catch {}
  }
})();

</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#122739">
<title>Schiffe versenken</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seegefecht">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Stencil+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: Kartentisch auf der Brücke. Seekarten-Papier mit Gradnetz, ein großes Plotting-Feld in der Mitte,
   Funkprotokoll darunter. Schablonenschrift wie auf Schiffsrümpfen, Signalflaggen-Rot und -Gelb für Treffer und Sichtungen. */
:root{
  --paper:#E2E8E3; --surface:#F2F5F1; --surface2:#E9EEEA; --sea:#CAD9DA; --sea-alt:#C1D2D4; --grid:#94ADB2; --line:#B9C8C8;
  --ink:#122739; --muted:#4A5F6F; --faint:#7D909C;
  --hull:#9CACB6; --deck:#72848F; --hull-sunk:#56636C;
  --hit:#D2283C; --hit-ink:#FFFFFF; --gold:#E3A400; --blue:#1C4F9C; --ok:#1E7A4B;
  --shadow:0 1px 0 rgba(18,39,57,.06),0 8px 24px -12px rgba(18,39,57,.28);
  --f-display:"Big Shoulders Stencil Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#09121A; --surface:#101C26; --surface2:#15232F; --sea:#0E2432; --sea-alt:#11293A; --grid:#21475A; --line:#1E3443;
  --ink:#DAE5EA; --muted:#8EA4B1; --faint:#5F7686;
  --hull:#7B8C97; --deck:#566672; --hull-sunk:#36424B;
  --hit:#FF5568; --hit-ink:#1A0508; --gold:#FFC340; --blue:#7DA9FF; --ok:#4CC48D;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#09121A; --surface:#101C26; --surface2:#15232F; --sea:#0E2432; --sea-alt:#11293A; --grid:#21475A; --line:#1E3443;
  --ink:#DAE5EA; --muted:#8EA4B1; --faint:#5F7686;
  --hull:#7B8C97; --deck:#566672; --hull-sunk:#36424B;
  --hit:#FF5568; --hit-ink:#1A0508; --gold:#FFC340; --blue:#7DA9FF; --ok:#4CC48D;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.narrow{max-width:560px;margin:0 auto}
.stencil{font-family:var(--f-display);font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.mono{font-family:var(--f-mono)}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:8px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.top .ttl{flex:1;min-width:0;font:800 20px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dot.bad{background:var(--hit)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r);border:1px solid var(--ink);
  background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.fire{background:var(--hit);border-color:var(--hit);color:var(--hit-ink);font:800 22px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;min-height:52px}
.btn.ghost{border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip svg{width:18px;height:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;min-height:42px;font-weight:700;cursor:pointer;padding:0 8px}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- Karten / Felder ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label,.lab{font-weight:700;font-size:14px}
input[type=text],input[type=password],select{width:100%;min-height:46px;border-radius:var(--r);border:1px solid var(--grid);background:var(--surface2);color:var(--ink);padding:0 12px;font:inherit}
.switch{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.switch input{appearance:none;flex:none;width:44px;height:26px;border-radius:999px;background:var(--grid);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(18px)}
.switch b{display:block}
.switch small{display:block;color:var(--muted);font-size:13px}

/* ---------- Startseite ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding-block:18px 8px}
.hero h1{font:800 clamp(52px,14vw,104px)/.86 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.hero h1 span{display:block;color:var(--hit)}
.hero p{margin:10px 0 0;color:var(--muted);max-width:34ch}
.scope{width:clamp(108px,30vw,200px);aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle,transparent 0 22%,var(--grid) 22.5% 23%,transparent 23.5% 45%,var(--grid) 45.5% 46%,transparent 46.5% 68%,var(--grid) 68.5% 69.5%,transparent 70%),var(--sea);
  border:2px solid var(--ink)}
.scope::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 300deg,color-mix(in srgb,var(--ok) 55%,transparent) 360deg);animation:sweep 3.6s linear infinite}
.scope::after{content:"";position:absolute;inset:50% 0 auto;height:1px;background:var(--grid);box-shadow:0 0 0 0 transparent}
.scope i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--hit);box-shadow:0 0 0 4px color-mix(in srgb,var(--hit) 25%,transparent);animation:blip 3.6s linear infinite}
@media (max-width:620px){.hero{display:block;position:relative}.hero .scope{position:absolute;right:0;top:6px;width:clamp(54px,15vw,84px)}.hero h1{font-size:clamp(46px,14.5vw,96px)}.hero p{max-width:none}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes blip{0%,10%{opacity:1}60%,100%{opacity:.15}}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:18px}
.tile{display:grid;gap:4px;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--shadow)}
.tile b{font:800 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.tile span{color:var(--muted);font-size:14px}
.tile.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tile.pri span{color:color-mix(in srgb,var(--paper) 75%,transparent)}
.codein{display:flex;gap:8px}
.codein input{font:800 30px/1 var(--f-display);letter-spacing:.3em;text-transform:uppercase;text-align:center;min-height:56px;padding-left:.3em}
.codein .btn{flex:none}
.games{display:grid;gap:8px}
.gamerow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.gamerow .code{font:800 22px/1 var(--f-display);letter-spacing:.1em}
.gamerow .meta{flex:1;min-width:0}
.gamerow .meta small{display:block;color:var(--muted)}
.notice{border:1px dashed var(--grid);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--muted);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.notice b{color:var(--ink)}

/* ---------- Partie einrichten ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.mode{display:grid;gap:6px;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.mode b{font:800 24px/1 var(--f-display);text-transform:uppercase}
.mode span{font-size:14px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.shiplist{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.shiprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.shiprow:first-child{border-top:0}
.shiprow .info{display:grid;gap:4px;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.shiprow .nm{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.shiprow .nm small{color:var(--muted);font-weight:500}
.shiprow .ab{font-size:13px;color:var(--muted)}
.shiprow .ab b{color:var(--ink)}
.sil{display:block;height:18px}
.stepper{display:flex;align-items:center;border:1px solid var(--grid);border-radius:999px;overflow:hidden}
.stepper button{width:38px;height:36px;border:0;background:transparent;font-size:20px;cursor:pointer}
.stepper output{min-width:22px;text-align:center;font:700 16px var(--f-mono)}
.fleetnote{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.warn{color:var(--hit);font-weight:700}

/* ---------- Spielfeld ---------- */
.boardbox{position:relative;width:min(100%,560px);margin:0 auto}
.board{--lab:20px;display:grid;grid-template-columns:var(--lab) repeat(var(--n),minmax(0,1fr));grid-template-rows:var(--lab) repeat(var(--n),minmax(0,1fr));
  gap:1px;aspect-ratio:1;width:100%;user-select:none;-webkit-user-select:none}
.board .lbl{display:grid;place-items:center;font:600 11px/1 var(--f-mono);color:var(--muted)}
.board .lbl.top{grid-row:1}
.board .lbl.side{grid-column:1}
.cell{border:0;padding:0;margin:0;background:var(--sea);cursor:pointer;position:relative;z-index:1;min-width:0;min-height:0;border-radius:1px}
.board.target .cell.open:hover{background:var(--sea-alt)}
.board.locked .cell{cursor:default}
.cell.ks{background:color-mix(in srgb,var(--hull-sunk) 55%,var(--sea))}
.board::before{content:"";grid-row:2/-1;grid-column:2/-1;background:var(--grid);margin:-1px;border-radius:3px;z-index:0;border:1px solid var(--grid)}
.shp{z-index:2;pointer-events:none;position:relative}
.shp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shp.ghostship{opacity:.35}
.shp.sel svg{filter:drop-shadow(0 0 0 var(--gold)) drop-shadow(0 0 3px var(--gold))}
.hull{fill:var(--hull);stroke:var(--ink);stroke-width:1.1}
.deck{fill:var(--deck);stroke:var(--ink);stroke-width:.8}
.det{fill:none;stroke:var(--ink);stroke-width:.9}
.det.l{stroke:var(--paper);stroke-dasharray:3 3}
.ink{fill:var(--ink)}
.ship *{vector-effect:non-scaling-stroke}
.shp.sunk .hull{fill:var(--hull-sunk)}
.shp.sunk .deck{fill:color-mix(in srgb,var(--hull-sunk) 70%,var(--ink))}
.shp.wreck{opacity:.92}
.shp.reveal{opacity:.55}
.ov{z-index:3;pointer-events:none;display:grid;place-items:center;position:relative}
.ov svg{width:72%;height:72%}
.ov.pv{outline:2px solid var(--gold);outline-offset:-2px;background:color-mix(in srgb,var(--gold) 22%,transparent);border-radius:2px}
.ov.pv.bad{outline-color:var(--hit);background:color-mix(in srgb,var(--hit) 18%,transparent)}
.ov.sel{outline:2px solid var(--ink);outline-offset:-1px}
.ov.trail{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.ov.gh{background:color-mix(in srgb,var(--ok) 35%,transparent);outline:2px solid var(--ok);outline-offset:-2px}
.ov.gh.bad{background:color-mix(in srgb,var(--hit) 30%,transparent);outline-color:var(--hit)}
.m-hit{fill:var(--hit);stroke:var(--ink);stroke-width:1}
.m-miss{fill:none;stroke:var(--ink);stroke-width:1.4;opacity:.7}
.m-dot{fill:var(--ink);opacity:.7}
.m-spot{fill:none;stroke:var(--gold);stroke-width:2.4}
.m-mine{fill:var(--ink)}
.m-fix{fill:none;stroke:var(--ok);stroke-width:2.2;stroke-linecap:round}
.m-flak{fill:none;stroke:var(--muted);stroke-width:1.6}
.ov.fx{animation:pop .7s ease-out both}
.ov.fx::after{content:"";position:absolute;inset:-30%;border-radius:50%;border:2px solid var(--fxc,var(--ink));animation:ring .9s ease-out both;animation-delay:inherit}
.ov.fx.hit{--fxc:var(--hit)}
.ov.fx.spot{--fxc:var(--gold)}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.board.setup{touch-action:none}

/* ---------- Gefecht ---------- */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;margin-bottom:10px}
.pl{display:flex;align-items:center;gap:8px;min-width:0}
.pl.r{justify-content:flex-end;text-align:right}
.pl .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small{display:block;color:var(--muted);font:500 12px var(--f-mono)}
.pl.turn .nm{text-decoration:underline;text-decoration-color:var(--hit);text-decoration-thickness:3px;text-underline-offset:4px}
.flag{width:30px;height:21px;flex:none;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.score{font:800 26px/1 var(--f-display);letter-spacing:.04em}
.status{display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 14px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line)}
.status b{font:800 22px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em;display:block}
.status small{color:var(--muted);display:block;font-size:13px}
.status.mine{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.status.mine small{color:color-mix(in srgb,var(--paper) 72%,transparent)}
.status .pulse{width:12px;height:12px;border-radius:50%;background:var(--hit);flex:none;animation:pulse 1.2s ease-in-out infinite}
.status.wait .pulse{background:var(--faint)}
@keyframes pulse{50%{transform:scale(.6);opacity:.5}}
.battle{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.view{min-width:0}
.view h3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font:800 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.view h3 small{font:500 12px var(--f-mono);color:var(--muted);text-transform:none;letter-spacing:0}
.battle.tabs-mode{max-width:600px;margin:0 auto;width:100%}
.battle.tabs-mode .view h3{display:none}
.battle[data-show="target"] .view.own,.battle[data-show="own"] .view.target{display:none}
.battle.both .view.own.incoming h3{color:var(--hit)}
@media (min-width:900px){
  .battle.both{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"tgt own" "ctl log";align-items:start}
  .battle.both .view.target{grid-area:tgt}
  .battle.both .view.own{grid-area:own}
  .battle.both .control{grid-area:ctl}
  .battle.both .log{grid-area:log}
}
.segopt{display:grid;place-items:center;min-height:42px;cursor:pointer;font-weight:700;position:relative}
.segopt+.segopt{border-left:1px solid var(--ink)}
.segopt input{position:absolute;opacity:0;pointer-events:none}
.segopt:has(input:checked){background:var(--ink);color:var(--paper)}
.segopt:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:-4px}
/* Felder ohne mögliches Schiff und Sonar-/Radarbereiche */
.cell.blk{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--faint) 30%,var(--sea)) 0 3px,var(--sea) 3px 7px);cursor:not-allowed}
.board.target .cell.blk:hover{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--faint) 30%,var(--sea)) 0 3px,var(--sea) 3px 7px)}
.zone{z-index:1;pointer-events:none;position:relative;border:2px dashed var(--blue);border-radius:4px;background:color-mix(in srgb,var(--blue) 12%,transparent);margin:1px}
.zone.z-aufklaerung{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.zone.z-wasserbomben{border-style:dotted}
.zone.foe{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 8%,transparent)}
.zone b{position:absolute;top:-9px;right:-9px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:var(--blue);color:var(--paper);font:700 12px/1 var(--f-mono);z-index:4;box-shadow:0 0 0 2px var(--paper)}
.zone.z-aufklaerung b{background:var(--gold);color:var(--ink)}
.zone.foe b{background:var(--hit);color:var(--hit-ink)}
.abbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.abchip{display:grid;grid-template-columns:auto auto;gap:0 8px;align-items:center;text-align:left;min-height:52px;padding:6px 12px 6px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.abchip svg{grid-row:span 2;width:28px;height:28px}
.abchip b{font-size:14px;line-height:1.1}
.abchip small{font:500 11px var(--f-mono);color:var(--muted)}
.abchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.abchip[aria-pressed="true"] small{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.abchip[disabled]{opacity:.38;cursor:not-allowed}
.ico{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.control{display:grid;gap:10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.control .what{display:flex;gap:10px;align-items:flex-start}
.control .what>svg{width:30px;height:30px;flex:none;margin-top:2px}
.control .what p{margin:0;font-size:14px}

<body>
<div id="app" aria-live="polite"></div>
<script src="config.js"></script>
<script>
/* ============================================================
   Schiffe versenken – Spiel-Engine (reine Logik, ohne Oberfläche)
   Beide Geräte rechnen aus demselben Ereignis-Protokoll denselben
   Spielstand aus. Die eigene Flotte kennt nur das eigene Gerät.
   ============================================================ */
const SV = (() => {
  const W = 16;                                   // Index-Schrittweite (Felder bis 12×12)
  const ix = (r, c) => r * W + c;
  const rc = (i) => [Math.floor(i / W), i % W];
  const range = (n) => Array.from({ length: n }, (_, k) => k);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- NATO-Alphabet ---------- */
  const NATO = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot', 'Golf', 'Hotel', 'India', 'Juliett', 'Kilo', 'Lima'];
  const NUM = ['null', 'eins', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun', 'zehn', 'elf', 'zwölf'];
  const letter = (c) => String.fromCharCode(65 + c);
  const short = (i) => { const [r, c] = rc(i); return letter(c) + (r + 1); };
  const nato = (i) => { const [r, c] = rc(i); return `${NATO[c]} ${r + 1}`; };
  const spoken = (i) => { const [r, c] = rc(i); return `${NATO[c]} ${NUM[r + 1]}`; };

  /* ---------- Fähigkeiten ---------- */
  const AB = {
    luftangriff: { n: 'Luftangriff', icon: 'plane', kind: 'attack', input: 'cell', uses: 1, pat: '2×2',
      d: 'Eine Staffel wirft 4 Bomben auf ein Quadrat aus 2×2 Feldern. Jede Bombe wirkt wie ein Schuss.',
      x: 'Schwimmt beim Gegner noch eine Fregatte, schießt ihre Flugabwehr eine Bombe ab.' },
    aufklaerung: { n: 'Aufklärungsflug', icon: 'eye', kind: 'intel', input: 'cell', uses: 1, pat: '3×3',
      d: 'Ein Flugzeug überfliegt 3×3 Felder und markiert jedes heile Schiffsteil darin gelb. Es richtet keinen Schaden an.',
      x: 'Getauchte U-Boote sieht das Flugzeug nicht.' },
    breitseite: { n: 'Breitseite', icon: 'line', kind: 'attack', input: 'cell+dir', uses: 2, pat: '3 in Linie',
      d: 'Drei Schüsse nebeneinander. Du wählst das mittlere Feld und ob waagerecht oder senkrecht.' },
    salve: { n: 'Raketensalve', icon: 'x', kind: 'attack', input: 'cell', uses: 1, pat: 'X-Muster',
      d: 'Fünf Raketen im X: das Zielfeld und seine vier schrägen Nachbarn.' },
    radar: { n: 'Radar', icon: 'radar', kind: 'intel', input: 'line', uses: 1, pat: 'Zeile/Spalte',
      d: 'Durchsucht eine ganze Zeile oder Spalte und meldet, wie viele heile Schiffsteile dort liegen, aber nicht wo.',
      x: 'U-Boote zählen nicht mit.' },
    torpedo: { n: 'Torpedo', icon: 'torpedo', kind: 'attack', input: 'edge', uses: 2, pat: 'Laufbahn',
      d: 'Läuft vom Rand eine Zeile oder Spalte entlang und trifft das erste heile Schiffsteil. Das Wasser auf seinem Weg wird als Fehlschuss markiert.',
      x: 'Läuft er auf eine Mine, explodieren beide. Es gibt dann keine Strafe.' },
    sonar: { n: 'Sonar', icon: 'sonar', kind: 'intel', input: 'cell', uses: 2, pat: '3×3',
      d: 'Ein Ping meldet, wie viele heile Schiffsteile in 3×3 Feldern liegen, aber nicht wo.',
      x: 'Findet auch U-Boote.' },
    schnellfeuer: { n: 'Schnellfeuer', icon: 'two', kind: 'attack', input: 'two', uses: 1, pat: '2 Felder',
      d: 'Zwei Schüsse auf zwei beliebige Felder in einem Zug.' },
    wasserbomben: { n: 'Wasserbomben', icon: 'plus', kind: 'attack', input: 'cell', uses: 2, pat: 'Plus-Muster',
      d: 'Fünf Wasserbomben im Plus. Sie treffen nur U-Boote. Felder ohne U-Boot bleiben unbekannt.' },
    reparatur: { n: 'Reparatur', icon: 'wrench', kind: 'self', input: 'own', uses: 1, pat: 'eigenes Feld',
      d: 'Repariert ein getroffenes Feld an einem deiner Schiffe, das noch schwimmt. Der Gegner sieht, wo repariert wurde, und muss dort erneut treffen.' },
  };
  const PASSIVE = {
    tarnung: { n: 'Tarnung', d: 'Radar und Aufklärungsflug sehen das U-Boot nicht. Nur Sonar und Wasserbomben spüren es auf.' },
    flak: { n: 'Flugabwehr', d: 'Solange die Fregatte schwimmt, schießt sie bei jedem gegnerischen Luftangriff eine der vier Bomben ab.' },
    minen: { n: 'Seeminen', d: 'Beim Aufstellen legst du 2 Minen ins freie Wasser. Wer eine Mine trifft, setzt seinen nächsten Zug aus. Minen bleiben scharf, auch wenn der Minenleger sinkt.' },
  };

  /* ---------- Schiffstypen ---------- */
  // kg = Schlüssel in KahloGames (dort zählt nur die Länge)
  const SHIPS = [
    { k: 'traeger', n: 'Flugzeugträger', len: 5, ab: ['luftangriff', 'aufklaerung'] },
    { k: 'schlacht', n: 'Schlachtschiff', len: 4, ab: ['breitseite'] },
    { k: 'raketen', n: 'Raketenkreuzer', len: 4, ab: ['salve'] },
    { k: 'kreuzer', n: 'Kreuzer', len: 3, ab: ['radar'] },
    { k: 'uboot', n: 'U-Boot', len: 3, ab: ['torpedo'], passive: 'tarnung' },
    { k: 'fregatte', n: 'Fregatte', len: 3, ab: [], passive: 'flak' },
    { k: 'werkstatt', n: 'Werkstattschiff', len: 3, ab: ['reparatur'] },
    { k: 'zerstoerer', n: 'Zerstörer', len: 2, ab: ['sonar'] },
    { k: 'patrouille', n: 'Patrouillenboot', len: 2, ab: ['schnellfeuer'] },
    { k: 'minenleger', n: 'Minenleger', len: 2, ab: [], passive: 'minen' },
    { k: 'korvette', n: 'Korvette', len: 2, ab: ['wasserbomben'] },
  ];
  const SHIP = Object.fromEntries(SHIPS.map((s) => [s.k, s]));
  const KG_KEY = { 5: 'traeger', 4: 'schlacht', 3: 'zerstoerer3', 2: 'patrouille' };

  const PRESETS = [
    { id: 'klassisch', n: 'Klassisch', d: '5 Schiffe, wie im Original', fleet: { traeger: 1, schlacht: 1, kreuzer: 1, uboot: 1, zerstoerer: 1 } },
    { id: 'deutsch', n: 'Deutsche Regel', d: '1× 5er, 2× 4er, 3× 3er, 4× 2er', fleet: { traeger: 1, schlacht: 1, raketen: 1, kreuzer: 1, uboot: 1, fregatte: 1, zerstoerer: 1, patrouille: 1, minenleger: 1, korvette: 1 } },
    { id: 'kampfgruppe', n: 'Kampfgruppe', d: '6 Schiffe mit gemischten Fähigkeiten', fleet: { traeger: 1, schlacht: 1, uboot: 1, fregatte: 1, zerstoerer: 1, minenleger: 1 } },
    { id: 'klein', n: 'Kurze Partie', d: '4 Schiffe für 8×8', fleet: { schlacht: 1, uboot: 1, zerstoerer: 1, patrouille: 1 } },
  ];

  const DEFAULT_SETTINGS = { mode: 'ab', n: 10, fleet: { ...PRESETS[2].fleet }, touch: false, again: true };

  /* Schiffe einer Flotte als einzelne Einheiten (z. B. schlacht0, schlacht1) */
  function instances(fleet) {
    const out = [];
    for (const s of SHIPS) {
      const cnt = +fleet[s.k] || 0;
      for (let j = 0; j < cnt; j++) out.push({ id: s.k + j, k: s.k, label: s.n + (cnt > 1 ? ' ' + ['I', 'II', 'III', 'IV'][j] : '') });
    }
    return out;
  }
  const fleetCount = (fleet) => SHIPS.reduce((a, s) => a + (+fleet[s.k] || 0), 0);
  const fleetCells = (fleet) => SHIPS.reduce((a, s) => a + (+fleet[s.k] || 0) * s.len, 0);
  const minesFor = (settings) => settings.mode === 'ab' ? 2 * (+settings.fleet.minenleger || 0) : 0;
  const shipCells = (s) => range(SHIP[s.k].len).map((j) => (s.v ? ix(s.r + j, s.c) : ix(s.r, s.c + j)));

  /* ---------- Aufstellung ---------- */
  function neighbors8(i) {
    const [r, c] = rc(i), out = [];
    for (let y = r - 1; y <= r + 1; y++) for (let x = c - 1; x <= c + 1; x++) if ((y !== r || x !== c) && y >= 0 && x >= 0) out.push(ix(y, x));
    return out;
  }
  function fits(occ, s, n, touch) {
    const cells = shipCells(s);
    for (const i of cells) {
      const [r, c] = rc(i);
      if (r < 0 || c < 0 || r >= n || c >= n) return false;
      const o = occ.get(i);
      if (o && o !== s.id) return false;
      if (!touch) for (const nb of neighbors8(i)) { const q = occ.get(nb); if (q && q !== s.id) return false; }
    }
    return true;
  }
  function occupancy(ships) { const occ = new Map(); for (const s of ships) for (const i of shipCells(s)) occ.set(i, s.id); return occ; }

  function validSetup(setup, settings) {
    const n = settings.n, want = instances(settings.fleet);
    if (!setup || !Array.isArray(setup.fleet) || setup.fleet.length !== want.length) return 'Nicht alle Schiffe sind gesetzt.';
    const ids = new Set(want.map((w) => w.id + ':' + w.k));
    for (const s of setup.fleet) if (!ids.has(s.id + ':' + s.k)) return 'Unbekanntes Schiff.';
    const occ = new Map();
    for (const s of setup.fleet) {
      for (const i of shipCells(s)) {
        const [r, c] = rc(i);
        if (r < 0 || c < 0 || r >= n || c >= n) return 'Ein Schiff ragt über den Rand.';
        if (occ.has(i)) return 'Zwei Schiffe überlappen sich.';
        occ.set(i, s.id);
      }
    }
    if (!settings.touch) for (const [i, id] of occ) for (const nb of neighbors8(i)) { const q = occ.get(nb); if (q && q !== id) return 'Schiffe dürfen sich nicht berühren, auch nicht über Eck.'; }
    const mines = setup.mines || [];
    if (mines.length !== minesFor(settings)) return 'Nicht alle Minen sind gelegt.';
    const ms = new Set();
    for (const m of mines) {
      const [r, c] = rc(m);
      if (r < 0 || c < 0 || r >= n || c >= n || occ.has(m) || ms.has(m)) return 'Eine Mine liegt an einer ungültigen Stelle.';
      ms.add(m);
    }
    return null;
  }

  function randomSetup(settings, rnd = Math.random) {
    const n = settings.n;
    const list = instances(settings.fleet).sort((a, b) => SHIP[b.k].len - SHIP[a.k].len);
    for (let attempt = 0; attempt < 500; attempt++) {
      const placed = [], occ = new Map();
      let ok = true;
      for (const it of list) {
        let done = false;
        for (let t = 0; t < 250 && !done; t++) {
          const v = rnd() < 0.5, len = SHIP[it.k].len;
          const r = Math.floor(rnd() * (v ? n - len + 1 : n)), c = Math.floor(rnd() * (v ? n : n - len + 1));
          const s = { id: it.id, k: it.k, r, c, v };
          if (fits(occ, s, n, settings.touch)) { placed.push(s); for (const i of shipCells(s)) occ.set(i, s.id); done = true; }
        }
        if (!done) { ok = false; break; }
      }
      if (!ok) continue;
      const mines = [], need = minesFor(settings);
      const free = [];
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!occ.has(ix(r, c))) free.push(ix(r, c));
      while (mines.length < need && free.length) mines.push(free.splice(Math.floor(rnd() * free.length), 1)[0]);
      return { fleet: placed, mines };
    }
    return null;
  }
  const fleetFits = (settings) => !!randomSetup(settings);

  /* ---------- Zielmuster ---------- */
  function cellsOf(a, n) {
    const inb = ([y, x]) => y >= 0 && x >= 0 && y < n && x < n;
    const pts = (l) => l.filter(inb).map(([y, x]) => ix(y, x));
    let [r, c] = a.i != null ? rc(a.i) : [0, 0];
    const mid = () => { r = clamp(r, 1, n - 2); c = clamp(c, 1, n - 2); };
    switch (a.t) {
      case 'shot': return [a.i];
      case 'breitseite':
        if (a.v) { r = clamp(r, 1, n - 2); return pts([[r - 1, c], [r, c], [r + 1, c]]); }
        c = clamp(c, 1, n - 2); return pts([[r, c - 1], [r, c], [r, c + 1]]);
      case 'salve': mid(); return pts([[r, c], [r - 1, c - 1], [r - 1, c + 1], [r + 1, c - 1], [r + 1, c + 1]]);
      case 'wasserbomben': mid(); return pts([[r, c], [r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]);
      case 'luftangriff': { const y = Math.min(r, n - 2), x = Math.min(c, n - 2); return pts([[y, x], [y, x + 1], [y + 1, x], [y + 1, x + 1]]); }
      case 'aufklaerung': case 'sonar': { mid(); const o = []; for (let y = r - 1; y <= r + 1; y++) for (let x = c - 1; x <= c + 1; x++) o.push([y, x]); return pts(o); }
      case 'radar': return a.v ? range(n).map((y) => ix(y, c)) : range(n).map((x) => ix(r, x));
      case 'torpedo': { const l = a.v ? range(n).map((y) => ix(y, c)) : range(n).map((x) => ix(r, x)); return a.rev ? l.reverse() : l; }
      case 'schnellfeuer': return a.j != null ? [a.i, a.j] : [a.i];
      case 'reparatur': return [a.i];
    }
    return [];
  }
  // Mittelpunkt für Ansagen (bei Mustern das tatsächlich getroffene Zentrum)
  function centerOf(a, n) {
    const cs = cellsOf(a, n);
    if (a.t === 'salve' || a.t === 'wasserbomben') return cs[0];
    if (a.t === 'sonar' || a.t === 'aufklaerung') return cs[4];
    if (a.t === 'breitseite') return cs[1];
    if (a.t === 'luftangriff') return cs[0];
    return a.i;
  }
  // Wie viele Schüsse zählt eine Aktion für die Trefferquote?
  const shotsOf = (a, n) => (a.t === 'torpedo' ? 1 : ['shot', 'breitseite', 'salve', 'luftangriff', 'schnellfeuer', 'wasserbomben'].includes(a.t) ? cellsOf(a, n).length : 0);

  /* ---------- Eigene Flotte durchrechnen ---------- */
  function fleetState(setup, n) {
    return {
      n,
      ships: setup.fleet.map((s) => ({ id: s.id, k: s.k, cells: shipCells(s), hit: Array(SHIP[s.k].len).fill(false), sunk: false })),
      mines: new Set(setup.mines || []),
      used: {},                                   // shipId -> {abId: count}
    };
  }
  function shipAt(F, i) { for (const s of F.ships) { const j = s.cells.indexOf(i); if (j >= 0) return [s, j]; } return null; }

    const shoot = (i) => {

      const h = shipAt(F, i);
      if (h) { h[0].hit[h[1]] = true; out.cells.push({ i, s: 'hit' }); } else out.cells.push({ i, s: 'miss' });

/* ============================================================
   Verbindung: Supabase (online), Tabs im selben Browser (Test),
   Computer-Gegner (im Speicher). Dazu die Partie-Sitzung.
   ============================================================ */
const CFG = Object.assign({ supabaseUrl: '', supabaseKey: '', kahloGamesUrl: '' }, window.SV_CONFIG || {});
const online = !!(CFG.supabaseUrl && CFG.supabaseKey);

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  raw(k) { try { return localStorage.getItem(k); } catch { return null; } },
  rawSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const rid = (n = 10) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map((b) => (b % 36).toString(36)).join(''); };
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode = () => { const a = new Uint8Array(4); crypto.getRandomValues(a); return [...a].map((b) => CODE_CHARS[b % CODE_CHARS.length]).join(''); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const BOT_SPEED = window.SV_TEST ? 0.03 : 1;   // nur für automatische Tests

/* ---------- Supabase ---------- */
let sbClient = null;
function loadSupabase() {
  if (window.supabase?.createClient) return Promise.resolve();
  return new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.0/dist/umd/supabase.js';
    s.onload = ok; s.onerror = () => bad(new Error('Die Online-Verbindung konnte nicht geladen werden. Bitte Internet prüfen.'));
    document.head.appendChild(s);
  });
}
class SbTransport {
  constructor() { this.kind = 'online'; }
  async init() { await loadSupabase(); sbClient ||= window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: false } }); this.sb = sbClient; }
  async load(code, after = 0) {
    const { data, error } = await this.sb.from('bs_events').select('id,code,p,k,b,t').eq('code', code).gt('id', after).order('id', { ascending: true }).limit(2000);
    if (error) throw new Error(error.message);
    return data || [];
  }
  async send(ev) {
    const { data, error } = await this.sb.from('bs_events').insert(ev).select('id,code,p,k,b,t').single();
    if (error) throw new Error(error.message);
    return data;
  }
  async exists(code) {
    const { count, error } = await this.sb.from('bs_events').select('id', { count: 'exact', head: true }).eq('code', code);
    if (error) throw new Error(error.message);
    return count > 0;
  }
  subscribe(code, p, onEvents, onStatus, onPresence) {
    this.unsubscribe();
    const ch = this.sb.channel('sv-' + code, { config: { presence: { key: 'p' + p } } });
    ch.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bs_events', filter: 'code=eq.' + code }, (pl) => onEvents([pl.new]))
      .on('presence', { event: 'sync' }, () => onPresence(Object.keys(ch.presenceState())))
      .subscribe(async (status) => {
        onStatus(status);
        if (status === 'SUBSCRIBED') { try { await ch.track({ p, at: Date.now() }); } catch {} }
      });
    this.ch = ch;
  }
  unsubscribe() { if (this.ch) { try { this.sb.removeChannel(this.ch); } catch {} this.ch = null; } }
}

/* ---------- Zwei Tabs im selben Browser (zum Ausprobieren ohne Supabase) ---------- */
class TabTransport {
  constructor() { this.kind = 'tabs'; this.bc = ('BroadcastChannel' in window) ? new BroadcastChannel('sv-tabs') : null; }
  async init() {}
  key(code) { return 'sv.tabs.' + code; }
  async load(code, after = 0) { return LS.get(this.key(code), []).filter((e) => e.id > after); }
  async send(ev) {
    const list = LS.get(this.key(ev.code), []);
    const row = { ...ev, id: (list.at(-1)?.id || 0) + 1, t: new Date().toISOString() };
    list.push(row); LS.set(this.key(ev.code), list);
    this.bc?.postMessage(row);
    return row;
  }
  async exists(code) { return LS.get(this.key(code), []).length > 0; }
  subscribe(code, p, onEvents, onStatus, onPresence) {
    this.unsubscribe();
    this.h = (m) => { if (m.data?.code === code) onEvents([m.data]); };
    this.bc?.addEventListener('message', this.h);
    this.st = (e) => { if (e.key === this.key(code)) onEvents(LS.get(this.key(code), [])); };
    window.addEventListener('storage', this.st);
    onStatus('SUBSCRIBED'); onPresence(['p0', 'p1']);
  }
  unsubscribe() { if (this.h) this.bc?.removeEventListener('message', this.h); if (this.st) window.removeEventListener('storage', this.st); this.h = this.st = null; }
}

/* ---------- Computer-Gegner: gemeinsamer Speicher ---------- */
class MemBus {
  /* Partie gegen den Computer: Züge und beide Aufstellungen bleiben auf diesem Gerät gespeichert */
  constructor(code, saved) { this.code = code; this.events = saved?.events || []; this.recs = saved?.recs || {}; this.subs = new Set(); }
  save() { if (!this.gone) LS.set('sv.bot', { code: this.code, events: this.events, recs: this.recs }); }
  forget() { this.gone = true; try { localStorage.removeItem('sv.bot'); } catch {} }
  transport() {
    const bus = this;
    return {
      kind: 'bot', bus,
      async init() {},
      saveRec(p, rec) { bus.recs[p] = rec; bus.save(); },
      async load(code, after = 0) { return bus.events.filter((e) => e.id > after); },
      async send(ev) { const row = { ...ev, id: bus.events.length + 1, t: new Date().toISOString() }; bus.events.push(row); bus.save(); setTimeout(() => bus.subs.forEach((f) => f([row])), 0); return row; },
      async exists() { return bus.events.length > 0; },
      subscribe(code, p, onEvents, onStatus, onPresence) { this.f = onEvents; bus.subs.add(onEvents); onStatus('SUBSCRIBED'); onPresence(['p0', 'p1']); },
      unsubscribe() { if (this.f) bus.subs.delete(this.f); },
    };
  }
}

/* ---------- Gespeicherte Partien auf diesem Gerät ----------
   Online-Partien liegen im Gerätespeicher. Testpartien in zwei Tabs liegen
   im Speicher des jeweiligen Tabs, damit sich die Tabs nicht verwechseln. */
const SS = {
  get(k, d) { try { const v = sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const Games = {
  store(kind) { return kind === 'tabs' ? SS : LS; },
  all(kind) { return this.store(kind).get('sv.games', {}); },
  where(code) { return this.all('tabs')[code] ? 'tabs' : 'online'; },
  get(code) { return this.all('tabs')[code] || this.all('online')[code] || null; },
  put(code, rec) {
    const kind = rec.kind || this.where(code), a = this.all(kind);
    a[code] = { ...(a[code] || {}), ...rec, touched: Date.now() }; this.store(kind).set('sv.games', a); return a[code];
  },
  drop(code) { for (const k of ['tabs', 'online']) { const a = this.all(k); if (a[code]) { delete a[code]; this.store(k).set('sv.games', a); } } },
  open() {
    const out = [], now = Date.now();
    for (const k of ['online', 'tabs']) {
      const a = this.all(k);
      for (const [c, v] of Object.entries(a)) if (now - (v.touched || 0) > 1000 * 60 * 60 * 24 * 21) delete a[c];
      this.store(k).set('sv.games', a);
      out.push(...Object.entries(a).filter(([, v]) => !v.done).map(([code, v]) => ({ code, ...v })));
    }
    return out.sort((x, y) => y.touched - x.touched);
  },
};

/* ============================================================
   Sitzung einer Partie
   ============================================================ */
class Session {
  constructor({ code, p, transport, rec, bot = false, onChange }) {
    Object.assign(this, { code, p, transport, rec, bot, onChange });
    this.events = []; this.ids = new Set(); this.state = SV.reduce([]);
    this.status = 'connecting'; this.presence = []; this.busy = new Set(); this.queue = [];
    this.listeners = new Set();
    this.seenN = -1;                                      // höchste angesagte Aktion
  }
  get me() { return this.p; }
  get foe() { return 1 - this.p; }
  async start() {
    await this.transport.init();
    const evs = await this.transport.load(this.code, 0);
    this.add(evs, true);
    this.seenN = this.state.actions.length - 1;
    this.transport.subscribe(this.code, this.p, (l) => this.add(l), (s) => { this.status = s === 'SUBSCRIBED' ? 'ok' : (s === 'CLOSED' || s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') ? 'lost' : this.status; this.emit(); }, (keys) => { this.presence = keys; this.emit(); });
    if (this.transport.kind === 'online') {
      this.poll = setInterval(() => this.refresh(), 6000);
      this.vis = () => { if (document.visibilityState === 'visible') { this.refresh(); if (this.status === 'lost') this.transport.subscribe(this.code, this.p, (l) => this.add(l), (s) => { this.status = s === 'SUBSCRIBED' ? 'ok' : this.status; this.emit(); }, (k) => { this.presence = k; this.emit(); }); } };
      document.addEventListener('visibilitychange', this.vis);
    }
    this.duties();
    return this;
  }
  stop() { clearInterval(this.poll); if (this.vis) document.removeEventListener('visibilitychange', this.vis); this.transport.unsubscribe(); this.stopped = true; clearTimeout(this.botT); }
  async refresh() {
    try { this.add(await this.transport.load(this.code, this.state.lastId || 0)); if (this.status === 'error') this.status = 'ok'; }
    catch { this.status = 'error'; this.emit(); }
  }
  add(list, initial = false) {
    let changed = false;
    for (const e of list) if (e && e.id && !this.ids.has(e.id)) { this.ids.add(e.id); this.events.push(e); changed = true; }
    if (!changed) return;
    this.events.sort((a, b) => a.id - b.id);
    const prev = this.state;
    this.state = SV.reduce(this.events);
    if (!initial) this.emit(prev);
    if (!this.stopped) this.duties();
  }
  emit(prev) { this.onChange?.(this, prev); this.listeners.forEach((f) => f(this, prev)); }

  /* Senden mit Wiederholung */
  async post(k, b) {
    const ev = { code: this.code, p: this.p, k, b };
    for (let t = 0; t < 6; t++) {
      try { const row = await this.transport.send(ev); this.add([row]); if (this.status === 'error') { this.status = 'ok'; this.emit(); } return row; }
      catch (e) { this.status = 'error'; this.emit(); await sleep(800 * (t + 1)); }
    }
    throw new Error('Senden fehlgeschlagen. Bitte Verbindung prüfen.');
  }

  /* Eigene Flotte mit allen Treffern */
  fleet() { return this.rec.setup && this.state.settings ? SV.replayOwn(this.rec.setup, this.state.settings, this.state.actions, this.p) : null; }

  /* Automatische Aufgaben: Treffer melden, Flotte aufdecken, Computerzug */
  async duties() {
    const S = this.state;
    if (S.pending && S.pending.p === this.foe && this.rec.setup && !this.busy.has('res' + S.pending.n)) {
      const n = S.pending.n;
      this.busy.add('res' + n);
      const F = SV.replayOwn(this.rec.setup, S.settings, S.actions, this.p);
      const r = SV.resolve(F, S.pending.a, n);
      if (this.bot) await sleep(450 * BOT_SPEED);
      try { await this.post('res', { n, r }); } catch { this.busy.delete('res' + n); }
    }
    if (S.phase === 'over' && this.rec.setup && !S.reveals[this.p] && !this.busy.has('reveal') && (S.players[1].hash && S.players[0].hash)) {
      this.busy.add('reveal');
      try { await this.post('reveal', { setup: this.rec.setup, salt: this.rec.salt }); } catch { this.busy.delete('reveal'); }
    }
    if (this.transport.kind !== 'bot' && S.players[this.foe]?.name && this.rec.opp !== S.players[this.foe].name) this.persist({ opp: S.players[this.foe].name });
    if (S.phase === 'over' && !this.rec.done) { this.rec = { ...this.rec, done: true }; if (this.transport.kind !== 'bot') Games.put(this.code, { done: true }); }
    if (this.bot) this.botDuties();
  }

  /* ---------- Aktionen des Spielers ---------- */
  async ready(setup) {
    const salt = rid(16);
    const hash = await SV.hashSetup(setup, salt);
    this.rec = this.persist({ setup, salt, draft: null });
    await this.post('ready', { hash });
  }
  persist(o) { this.rec = { ...this.rec, ...o }; if (this.transport.kind === 'bot') this.transport.saveRec(this.p, this.rec); else Games.put(this.code, this.rec); return this.rec; }
  canAct() { const S = this.state; return S.phase === 'battle' && S.turn === this.p && !S.pending && !this.busy.has('act' + S.actions.length); }
  async act(a) {
    if (!this.canAct()) return false;
    const n = this.state.actions.length;
    this.busy.add('act' + n);
    try {
      if (a.t === 'reparatur') {
        const F = this.fleet();
        const r = SV.resolve(F, a, n);
        await this.post('self', { n, a, r });
      } else await this.post('act', { n, a });
      return true;
    } catch (e) { this.busy.delete('act' + n); throw e; }
  }
  resign() { return this.post('resign', {}); }

  /* ============ Computer-Gegner ============ */
  botDuties() {
    const S = this.state;
    if (!S.settings) return;
    if (this.p === 1 && !S.players[1].token && !this.busy.has('join')) { this.busy.add('join'); this.post('join', { name: 'Computer', token: rid(), flag: 9 }); return; }
    if (S.phase === 'setup' && !S.players[1].hash && !this.busy.has('ready')) {
      this.busy.add('ready');
      const setup = SV.randomSetup(S.settings);
      this.botT = setTimeout(() => this.ready(setup), 700 * BOT_SPEED);
      return;
    }
    if (S.phase === 'battle' && S.turn === this.p && !S.pending && !this.busy.has('bt' + S.actions.length)) {
      this.busy.add('bt' + S.actions.length);
      // Der Computer wartet, bis die Funkstimme ausgesprochen hat, und macht dann eine kurze Pause
      this.botT = setTimeout(async () => {
        if (this.stopped) return;
        if (!window.SV_TEST && typeof Voice !== 'undefined' && Voice.busy()) { await Voice.idle(); await sleep(500 + Math.random() * 400); }
        if (!this.stopped && this.state.turn === this.p && !this.state.pending) this.act(this.botMove()).catch(() => {});
      }, (1100 + Math.random() * 700) * BOT_SPEED);
    }
  }
  botMove() {
    const S = this.state, n = S.settings.n, K = S.known[this.p], F = this.fleet();
    const lvl = S.settings.level || 'schwer';
    const P = { leicht: { ab: 0.15, fix: 0.2, follow: 0.5, aim: false }, mittel: { ab: 0.25, fix: 0.35, follow: 1, aim: true }, schwer: { ab: 0.35, fix: 0.5, follow: 1, aim: true } }[lvl] || {};
    const blk = lvl === 'leicht' ? new Set() : SV.blockedCells(K, n, S.settings.touch);
    const unknown = (i) => (!K[i] || K[i] === 'spot' || K[i] === 'fix') && !blk.has(i);
    const all = []; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) all.push(SV.ix(r, c));
    let open = all.filter(unknown);
    if (!open.length) open = all.filter((i) => !K[i]);
    const sunkIds = new Set(S.sunk[this.p].map((s) => s.id));
    const left = SV.instances(S.settings.fleet).filter((x) => !sunkIds.has(x.id)).map((x) => SV.SHIP[x.k].len);
    const hits = all.filter((i) => K[i] === 'hit');
    const spots = all.filter((i) => K[i] === 'spot');
    const anyOf = (l) => l[Math.floor(Math.random() * l.length)];
    const adj = (i) => { const [r, c] = SV.rc(i); return [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([y, x]) => y >= 0 && x >= 0 && y < n && x < n).map(([y, x]) => SV.ix(y, x)).filter(unknown); };
    // Dichte: wie viele mögliche Lagen der restlichen Schiffe decken ein Feld ab? (Stufe Schwer)
    const dens = new Map();
    if (lvl === 'schwer') {
      const blocked = (i) => K[i] === 'miss' || K[i] === 'sunk' || K[i] === 'mine' || blk.has(i);
      for (const len of left) for (const v of [false, true]) for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        const cells = SV.range(len).map((j) => (v ? [r + j, c] : [r, c + j]));
        if (cells.some(([y, x]) => y >= n || x >= n)) continue;
        const ids = cells.map(([y, x]) => SV.ix(y, x));
        if (ids.some(blocked)) continue;
        const hitN = ids.filter((i) => K[i] === 'hit').length;
        for (const i of ids) if (unknown(i)) dens.set(i, (dens.get(i) || 0) + 1 + hitN * 12);
      }
    }
    const best = () => {
      if (lvl === 'schwer') { let b = open[0], bv = -1; for (const i of open) { const v = (dens.get(i) || 0) + Math.random() * 0.5; if (v > bv) { bv = v; b = i; } } return b; }
      if (hits.length && Math.random() < P.follow) {
        // Treffer verfolgen; Stufe Mittel bleibt dabei auf der Linie
        let cand = [...new Set(hits.flatMap(adj))];
        if (P.aim) {
          const line = cand.filter((a) => { const [ar, ac] = SV.rc(a); return hits.some((h) => { const [hr, hc] = SV.rc(h); return hits.some((h2) => h2 !== h && ((SV.rc(h2)[0] === hr && ar === hr) || (SV.rc(h2)[1] === hc && ac === hc))); }); });
          if (line.length) cand = line;
        }
        if (cand.length) return anyOf(cand);
      }
      if (P.aim) { const m = Math.min(...left, 2); const par = open.filter((i) => { const [r, c] = SV.rc(i); return (r + c) % m === 0; }); if (par.length) return anyOf(par); }
      return anyOf(open);
    };
    const mine = (ab) => F && F.ships.find((s) => SV.SHIP[s.k].ab.includes(ab) && SV.canUse(F, s.id, ab));
    const useAb = (ab, a) => { const s = mine(ab); return s ? { ...a, t: ab, ab, ship: s.id } : null; };
    if (S.settings.mode === 'ab' && F) {
      const dmg = F.ships.filter((s) => !s.sunk && s.hit.some(Boolean) && s.hit.some((h) => !h));
      if (dmg.length && Math.random() < P.fix) { const s = dmg[0]; const a = useAb('reparatur', { i: s.cells[s.hit.indexOf(true)] }); if (a) return a; }
      const target = hits.length ? best() : null;
      if (!hits.length && !spots.length && Math.random() < P.ab) {
        const t = best();
        const order = ['aufklaerung', 'luftangriff', 'salve', 'breitseite', 'schnellfeuer', 'torpedo', 'sonar', 'radar', 'wasserbomben'];
        for (const ab of order.sort(() => Math.random() - 0.5)) {
          let a = null;
          if (ab === 'schnellfeuer') { const o = open.filter((i) => i !== t); a = useAb(ab, { i: t, j: lvl === 'schwer' ? o.sort((x, y) => (dens.get(y) || 0) - (dens.get(x) || 0))[0] ?? t : anyOf(o) ?? t }); }
          else if (ab === 'torpedo') a = useAb(ab, { i: t, v: Math.random() < 0.5, rev: Math.random() < 0.5 });
          else if (ab === 'sonar' || ab === 'radar' || ab === 'wasserbomben') { if (lvl === 'leicht') a = useAb(ab, { i: t, v: Math.random() < 0.5 }); }
          else a = useAb(ab, { i: t, v: Math.random() < 0.5 });
          if (a) return a;
        }
      }
      if (P.aim && target && hits.length && Math.random() < 0.3) {
        const [r, c] = SV.rc(target);
        const v = hits.some((h) => SV.rc(h)[1] === c && Math.abs(SV.rc(h)[0] - r) === 1);
        const a = useAb('breitseite', { i: target, v });
        if (a) return a;
      }
    }
    if (spots.length) return { t: 'shot', i: spots[0] };
    return { t: 'shot', i: best() };
  }
}

/* ---------- Partie anlegen / beitreten ---------- */
function makeTransport(kind) { return kind === 'online' ? new SbTransport() : new TabTransport(); }

async function createGame({ settings, profile }) {
  const tr = makeTransport(online ? 'online' : 'tabs');
  await tr.init();
  let code;
  for (let t = 0; t < 8; t++) { code = newCode(); if (!(await tr.exists(code))) break; }
  const token = rid();
  const rec = Games.put(code, { p: 0, token, kind: tr.kind, mode: settings.mode, name: profile.name, created: Date.now() });
  const ses = new Session({ code, p: 0, transport: tr, rec });
  await ses.start();
  await ses.post('create', { settings, name: profile.name, kgId: profile.kgId || null, kg: !!profile.kg, token, flag: profile.flag ?? 0, v: 1 });
  return ses;
}

async function openGame(code, profile) {
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const local = Games.get(code);
  const tr = makeTransport(local?.kind || (online ? 'online' : 'tabs'));
  if (!local && !online && !(await tr.exists(code))) throw new Error(`Keine Partie mit dem Code ${code} gefunden.`);
  await tr.init();
  const evs = await tr.load(code, 0);
  if (!evs.length) throw new Error(`Keine Partie mit dem Code ${code} gefunden.`);
  const S = SV.reduce(evs);
  if (local && S.players[local.p]?.token === local.token) {
    const ses = new Session({ code, p: local.p, transport: tr, rec: local });
    return ses.start();
  }
  if (S.players[1].token) throw new Error('Diese Partie ist schon voll. Hier spielen bereits zwei.');
  const token = rid();
  const rec = Games.put(code, { p: 1, token, kind: tr.kind, mode: S.settings.mode, name: profile.name, opp: S.players[0].name, created: Date.now() });
  const ses = new Session({ code, p: 1, transport: tr, rec });
  await ses.start();
  await ses.post('join', { name: profile.name, kgId: profile.kgId || null, kg: !!profile.kg, token, flag: profile.flag ?? 0 });
  if (ses.state.players[1].token !== token) { Games.drop(code); ses.stop(); throw new Error('Jemand anderes war schneller. Die Partie ist voll.'); }
  return ses;
}

async function botGame({ settings, profile }) {
  const code = 'BOT' + rid(3).toUpperCase();
  const bus = new MemBus(code);
  bus.recs = { 0: { p: 0, token: rid() }, 1: { p: 1 } };
  const human = await botSessions(bus);
  await human.post('create', { settings, name: profile.name, token: human.rec.token, flag: profile.flag ?? 0 });
  for (let t = 0; t < 40 && human.state.phase === 'lobby'; t++) await sleep(50);
  return human;
}
async function botSessions(bus) {
  const human = new Session({ code: bus.code, p: 0, transport: bus.transport(), rec: bus.recs[0] });
  const bot = new Session({ code: bus.code, p: 1, transport: bus.transport(), rec: bus.recs[1], bot: true });
  await human.start(); await bot.start();
  human.botPeer = bot; human.bus = bus;
  return human;
}
/* Laufende Partie gegen den Computer nach dem Neuladen fortsetzen */
function savedBot() { const o = LS.get('sv.bot', null); if (!o?.events?.length || !o.recs?.[0]) return null; const S = SV.reduce(o.events); return S.phase === 'over' ? null : { o, S }; }
async function resumeBot() { const x = savedBot(); if (!x) return null; return botSessions(new MemBus(x.o.code, x.o)); }

/* ============================================================
   KahloGames (Google Sheet)
   ============================================================ */
const KG = {
  get url() { return CFG.kahloGamesUrl; },
  get pw() { return LS.raw('kg.pw'); },
  connected() { return !!(this.url && this.pw); },
  async call(action, data = {}) {
    if (!this.url) throw new Error('KahloGames ist nicht eingerichtet.');
    let res;
    try {
      const r = await fetch(this.url, { method: 'POST', body: JSON.stringify({ action, pw: data.pw ?? this.pw, ...data }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
      res = await r.json();
    } catch { throw new Error('Keine Verbindung zu KahloGames. Bitte Internet prüfen.'); }
    if (!res.ok) { const e = new Error(res.error || 'Fehler bei KahloGames'); e.code = res.code; throw e; }
    return res;
  },
  async login(pw) { await this.call('login', { pw }); LS.rawSet('kg.pw', pw); },
  logout() { LS.rawSet('kg.pw', null); },
  async players() { const r = await this.call('load'); LS.set('sv.kgPlayers', r.players.map((p) => ({ id: p.id, name: p.name }))); return r.players; },
  cachedPlayers() { return LS.get('sv.kgPlayers', []); },

  /* Ergebnis im Format der KahloGames-Seite (Spiel "schiffe") */
  match(S, ids) {
    const n = S.settings.n, P = ids;
    const fleet = {};
    for (const x of SV.instances(S.settings.fleet)) { const k = SV.KG_KEY[SV.SHIP[x.k].len]; fleet[k] = (fleet[k] || 0) + 1; }
    const sunk = {}, totals = {}, shots = {};
    [0, 1].forEach((p) => {
      const o = {};
      for (const s of S.sunk[p]) { const k = SV.KG_KEY[SV.SHIP[s.k].len]; o[k] = (o[k] || 0) + 1; }
      sunk[P[p]] = o; totals[P[p]] = S.sunk[p].length;
      if (S.shots[p] > 0) shots[P[p]] = S.shots[p];
    });
    const winners = S.winner == null ? [] : [P[S.winner]];
    const places = Object.fromEntries(P.map((id, p) => [id, S.winner == null ? 1 : p === S.winner ? 1 : 2]));
    const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    const cnt = SV.fleetCount(S.settings.fleet);
    return {
      game: 'schiffe', date: d.toISOString().slice(0, 10), board: { w: n, h: n }, fleet, players: P, sunk, totals, places, winners, shots,
      starter: P[S.starter], names: Object.fromEntries(P.map((id, p) => [id, S.players[p].name])),
      variant: S.settings.mode === 'ab' ? 'faehigkeiten' : 'klassisch', online: true,
      tags: [`${n}×${n}`, `${cnt} ${cnt === 1 ? 'Schiff' : 'Schiffe'}`, S.settings.mode === 'ab' ? 'Mit Fähigkeiten' : 'Klassisch', 'Online', ...(S.resigned != null ? ['aufgegeben'] : [])],
    };
  },
  async save(S, ids) { const r = await this.call('saveMatch', { match: this.match(S, ids) }); return r.match; },
};

/* ============================================================
   Einzelspieler: Flottenjagd (frei + Tagesmission) und Letzte Granate.
   Gegen den Computer läuft über Session (net.js) mit Stufe.
   ============================================================ */
const SOLO = (() => {
  const LEVELS = [
    { id: 'leicht', n: 'Leicht', d: 'Schießt meist aufs Geratewohl. Gut zum Reinkommen.' },
    { id: 'mittel', n: 'Mittel', d: 'Sucht im Schachbrettmuster und verfolgt Treffer wie ein erfahrener Spieler.' },
    { id: 'schwer', n: 'Schwer', d: 'Rechnet für jedes Feld aus, wie wahrscheinlich dort ein Schiff liegt, und setzt Fähigkeiten gezielt ein.' },
  ];
  const levelName = (id) => LEVELS.find((l) => l.id === id)?.n || 'Mittel';

  /* ---------- Zufall mit Startwert (für die Tagesmission) ---------- */
  function seeded(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    let a = h >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const DAILY = { mode: 'classic', n: 10, fleet: { traeger: 1, schlacht: 1, kreuzer: 1, uboot: 1, zerstoerer: 1 }, touch: false, again: false };

  /* ---------- Letzte Granate ---------- */
  const W = {
    start: 45, crates: 3, crate: 5, wave: 6, ship: (len) => len + 3,
    fleets: [
      { traeger: 1, schlacht: 1, kreuzer: 1, zerstoerer: 1 },
      { schlacht: 1, kreuzer: 1, uboot: 1, zerstoerer: 1, patrouille: 1 },

  };
  const waveFleet = (w) => W.fleets[Math.min(w, W.fleets.length - 1)];

  /* Punkte der Flottenjagd: 100 = so gut wie blind schießen. Blind braucht man im Schnitt K·(N+1)/(K+1) Schüsse. */
  function blindShots(settings) { const K = SV.fleetCells(settings.fleet), N = settings.n * settings.n; return (K * (N + 1)) / (K + 1); }
  const scoreOf = (settings, moves) => Math.round((100 * blindShots(settings)) / Math.max(1, moves));

  /* ============ Eine Jagd (Flottenjagd oder Wellen) ============ */
  class Hunt {
    constructor(o) {

        sunkTotal: 0, sunkCells: 0, sunkKinds: {}, used: {}, log: [], over: false, n: 0, started: Date.now() }, o);
    }
    static jagd(settings, { daily = null, counted = true } = {}) {
      const rnd = daily ? seeded('sv-tagesmission-' + daily) : Math.random;
      const h = new Hunt({ kind: 'jagd', settings, daily, counted });
      h.setup = SV.randomSetup(settings, rnd);
      h.fresh();
      return h;
    }
    static wellen() {
      const h = new Hunt({ kind: 'wellen', ammo: W.start });
      h.newWave();
      return h;
    }
    static load(o) { const h = new Hunt(o); h.fresh(true); return h; }
    newWave() {
      this.settings = { mode: 'classic', n: 10, fleet: { ...waveFleet(this.wave) }, touch: false, again: false };
      this.setup = SV.randomSetup(this.settings);
      const occ = SV.occupancy(this.setup.fleet), free = [];
      for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) if (!occ.has(SV.ix(r, c))) free.push(SV.ix(r, c));
      this.crateCells = [];
      while (this.crateCells.length < W.crates) this.crateCells.push(free.splice(Math.floor(Math.random() * free.length), 1)[0]);
      this.waveActs = [];
      this.fresh();
    }
    /* Flotte und Kenntnisstand aus den Aktionen dieser Welle berechnen */
    fresh(fromLoad) {
      this.F = SV.fleetState(this.setup, this.settings.n);
      this.K = {};
      this.sunkNow = [];
      this.zones = [];
      const acts = this.kind === 'wellen' ? (this.waveActs ||= []) : (this.acts ||= []);
      for (const x of acts) { const r = SV.resolve(this.F, x.a, x.n); this.mark(r); const z = SV.zoneOf(x.a, r, this.settings.n); if (z) this.zones.push(z); }
    }
    mark(r) {
      for (const c of r.cells || []) {
        const cur = this.K[c.i];
        if (c.s === 'flak') continue;
        if (c.s === 'spot') { if (!cur) this.K[c.i] = 'spot'; continue; }
        if (c.s === 'miss' && (cur === 'hit' || cur === 'sunk')) continue;
        if (c.s === 'miss' && this.kind === 'wellen' && this.crateCells?.includes(c.i)) { this.K[c.i] = 'crate'; continue; }
        this.K[c.i] = c.s;
      }
      for (const s of r.sunk || []) { this.sunkNow.push(s); for (const i of s.cells) this.K[i] = 'sunk'; }
    }
    abilities() {
      if (this.kind !== 'jagd' || this.settings.mode !== 'ab') return [];
      const map = new Map();
      for (const x of SV.instances(this.settings.fleet)) for (const ab of SV.SHIP[x.k].ab) {
        if (ab === 'reparatur') continue;
        const e = map.get(ab) || { ab, total: 0, left: 0, alive: true, ship: 'jagd' };
        e.total += SV.AB[ab].uses; map.set(ab, e);
      }
      for (const e of map.values()) e.left = e.total - (this.used[e.ab] || 0);

    }
    canAct() { return !this.over && !this.busy; }
    act(a) {
      if (!this.canAct()) return null;
      if (this.kind === 'wellen' && a.t !== 'shot') return null;
      if (a.ab) { const e = this.abilities().find((x) => x.ab === a.ab); if (!e || e.left <= 0) return null; this.used[a.ab] = (this.used[a.ab] || 0) + 1; }
      const n = this.n++;
      const r = SV.resolve(this.F, a, n);
      const fired = SV.shotsOf(a, this.settings.n);
      const hits = (r.cells || []).filter((c) => c.s === 'hit').length;
      const x = { n, a, r, wave: this.wave, gain: 0, crate: false };
      this.shots += fired; this.hits += hits;
      if (this.kind === 'jagd') {

      } else {

        this.waveActs.push({ n, a });
        const c0 = r.cells?.[0];
        if (c0?.s === 'miss' && this.crateCells.includes(a.i)) { this.ammo += W.crate; this.crates++; x.crate = true; x.gain += W.crate; }
      }
      for (const s of r.sunk || []) {
        this.sunkTotal++; this.sunkCells += SV.SHIP[s.k].len;
        this.sunkKinds[s.k] = (this.sunkKinds[s.k] || 0) + 1;
        if (this.kind === 'wellen') { const g = W.ship(SV.SHIP[s.k].len); this.ammo += g; x.gain += g; }
      }
      this.mark(r);
      const z = SV.zoneOf(a, r, this.settings.n); if (z) this.zones.push(z);
      if (r.over) {

        else { this.ammo += W.wave; x.gain += W.wave; x.waveDone = this.wave + 1; this.wave++; this.busy = true; }
      } else if (this.kind === 'wellen' && this.ammo <= 0) { this.over = true; this.result = 'empty'; }
      this.log.unshift(x); if (this.log.length > 60) this.log.length = 60;

    }
    /* nach kurzer Pause die nächste Welle auslaufen lassen */
    nextWave() { this.busy = false; this.newWave(); this.save(); }
    giveUp() { this.over = true; this.result = 'aufgegeben'; this.save(); }
    get score() { return this.kind === 'jagd' ? scoreOf(this.settings, this.moves) : this.sunkTotal; }
    save() {
      const o = {};
      for (const k of ['kind', 'daily', 'counted', 'wave', 'ammo', 'moves', 'shots', 'hits', 'penalties', 'mines', 'crates', 'sunkTotal', 'sunkCells', 'sunkKinds', 'used', 'log', 'over', 'result', 'n', 'started', 'settings', 'setup', 'crateCells', 'waveActs', 'acts', 'busy', 'saved']) o[k] = this[k];

  function resume() { const o = LS.get('sv.hunt', null); if (!o || !o.setup) return null; try { return Hunt.load(o); } catch { return null; } }

  /* ---------- Eigene Rekorde auf diesem Gerät ---------- */
  const rec = () => LS.get('sv.records', { jagd: {}, wellen: null, daily: {}, cpu: {} });

  const dailyDone = () => rec().daily[today()] ?? null;

  /* ============ Ergebnisse für KahloGames ============ */
  function kgFleet(fleet) { const o = {}; for (const x of SV.instances(fleet)) { const k = SV.KG_KEY[SV.SHIP[x.k].len]; o[k] = (o[k] || 0) + 1; } return o; }
  function kgSunk(kinds) { const o = {}; for (const [k, c] of Object.entries(kinds)) { const kk = SV.KG_KEY[SV.SHIP[k].len]; o[kk] = (o[kk] || 0) + c; } return o; }
  const base = (pid, name, extra) => ({ game: 'schiffe', mode: 'solo', date: today(), players: [pid], names: { [pid]: name }, winners: [], places: { [pid]: 1 }, ...extra });

  function cpuMatch(S, pid, name) {
    const st = S.settings, win = S.winner === 0, kinds = {};
    for (const s of S.sunk[0]) kinds[s.k] = (kinds[s.k] || 0) + 1;
    const hits = S.actions.filter((x) => x.p === 0 && !x.self).reduce((a, x) => a + (x.r.cells || []).filter((c) => c.s === 'hit').length, 0);
    return base(pid, name, {
      solo: 'cpu', level: st.level || 'mittel', result: win ? 'win' : 'loss', ...(S.resigned === 0 ? { resigned: true } : {}),
      variant: st.mode === 'ab' ? 'faehigkeiten' : 'klassisch', board: { w: st.n, h: st.n }, fleet: kgFleet(st.fleet),
      sunk: { [pid]: kgSunk(kinds) }, lost: S.sunk[1].length, ships: SV.fleetCount(st.fleet), totals: { [pid]: S.sunk[0].length },
      shots: { [pid]: S.shots[0] }, hits, cpuShots: S.shots[1], starter: S.starter === 0 ? pid : 'cpu',
      tags: ['Einzelspieler', 'Gegen Computer', levelName(st.level), win ? 'Sieg' : 'Niederlage', st.mode === 'ab' ? 'Mit Fähigkeiten' : 'Klassisch', `${st.n}×${st.n}`],
    });
  }
  function huntMatch(h, pid, name) {
    if (h.kind === 'jagd') {
      const st = h.settings;
      return base(pid, name, {
        solo: 'jagd', daily: h.daily || null, variant: st.mode === 'ab' ? 'faehigkeiten' : 'klassisch', board: { w: st.n, h: st.n }, fleet: kgFleet(st.fleet),
        moves: h.moves, score: h.score, cells: SV.fleetCells(st.fleet), penalties: h.penalties, abilities: Object.values(h.used).reduce((a, b) => a + b, 0),
        shots: { [pid]: h.shots }, hits: h.hits, sunk: { [pid]: kgSunk(h.sunkKinds) }, totals: { [pid]: h.score },
        tags: ['Einzelspieler', h.daily ? 'Tagesmission' : 'Flottenjagd', `${h.moves} Züge`, `${h.score} Punkte`, ...(h.daily ? [] : [st.mode === 'ab' ? 'Mit Fähigkeiten' : 'Klassisch', `${st.n}×${st.n}`])],

      shots: { [pid]: h.shots }, hits: h.hits, sunk: { [pid]: kgSunk(h.sunkKinds) }, totals: { [pid]: h.sunkTotal },

    add(m) { const a = Q.all(); m.qid = 'q' + Date.now() + Math.random().toString(36).slice(2, 6); a.push(m); LS.set('sv.unsaved', a); return m.qid; },
    drop(qid) { LS.set('sv.unsaved', Q.all().filter((m) => m.qid !== qid)); },
    has: (qid) => Q.all().some((m) => m.qid === qid),
    async flush() {

        try { await KG.call('saveMatch', { match }); Q.drop(qid); ok++; } catch (e) { if (e.code === 'auth') break; }
      }

    },
  };
  /* Ergebnis eintragen: mit KahloGames-Spieler sofort senden, sonst vormerken */

  }
  /* Vorgemerkte Ergebnisse ohne Spieler nachträglich zuordnen */

    LS.set('sv.unsaved', Q.all().map((m) => (m.players[0] ? m : { ...m, players: [pid], names: { [pid]: name }, places: { [pid]: 1 }, totals: { [pid]: Object.values(m.totals)[0] }, shots: { [pid]: Object.values(m.shots || {})[0] }, sunk: { [pid]: Object.values(m.sunk || {})[0] || {} }, ...(m.solo === 'cpu' && m.starter !== 'cpu' ? { starter: pid } : {}) })));
  }

  return { LEVELS, levelName, DAILY, W, waveFleet, blindShots, scoreOf, Hunt, resume, today, seeded, rec, noteRecord, noteCpu, dailyDone, jagdKey, cpuMatch, huntMatch, Q, submit, assign };
})();

const Voice = (() => {

    const want = App.prefs.voice;

  }

    list: () => { load(); return voices; },
    unlock() { if (!ss || unlocked) return; unlocked = true; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; ss.speak(u); } catch {} },
    say(text, { radio = true } = {}) {

      const token = {};
      queue.add(token);
      const done = () => { queue.delete(token); clearTimeout(safety); };

})();

/* ---------- Schiffs-Silhouetten (Draufsicht, Bug rechts) ---------- */
function shipBody(k, L) {
  const hull = (a = 24, b = 76) => `<path class="hull" d="M10 ${a + 6} Q10 ${a} 18 ${a} H${L - 90} C${L - 40} ${a} ${L - 14} ${42} ${L - 5} 50 C${L - 14} 58 ${L - 40} ${b} ${L - 90} ${b} H18 Q10 ${b} 10 ${b - 6} Z"/>`;
  const turret = (x, dir = 1) => `<circle class="deck" cx="${x}" cy="50" r="12"/><path class="det" d="M${x + 8 * dir} 45 h${26 * dir} M${x + 8 * dir} 55 h${26 * dir}"/>`;
  switch (k) {
    case 'traeger':
      return `<path class="hull" d="M8 18 H${L - 120} L${L - 8} 32 V68 L${L - 120} 84 H8 Z"/><path class="deck" d="M18 26 H${L - 125} L${L - 30} 38 V62 L${L - 125} 74 H18 Z"/>
        <path class="det l" d="M30 50 H${L - 50}"/><path class="det l" d="M60 70 L${L - 160} 32"/><rect class="hull" x="${L * 0.58}" y="9" width="62" height="18" rx="3"/>
        ${[0.22, 0.34, 0.46].map((f) => `<path class="ink" d="M${L * f} 40 l6 10 l-6 10 l3 -10 z M${L * f - 8} 50 h18" opacity=".7"/>`).join('')}`;
    case 'schlacht':
      return `${hull(20, 80)}<rect class="deck" x="${L * 0.38}" y="34" width="${L * 0.22}" height="32" rx="5"/>${turret(70, -1)}${turret(L - 190)}${turret(L - 120)}<circle class="det" cx="${L * 0.49}" cy="50" r="7"/>`;
    case 'raketen':
      return `${hull(22, 78)}<rect class="deck" x="${L * 0.42}" y="34" width="${L * 0.2}" height="32" rx="5"/>
        ${[0, 1, 2].map((r) => [0, 1, 2, 3].map((c) => `<rect class="deck" x="${L - 170 + c * 18}" y="${33 + r * 12}" width="13" height="9"/>`).join('')).join('')}
        ${[0, 1].map((r) => [0, 1, 2].map((c) => `<rect class="deck" x="${40 + c * 18}" y="${39 + r * 12}" width="13" height="9"/>`).join('')).join('')}`;
    case 'kreuzer':
      return `${hull(26, 74)}<rect class="deck" x="${L * 0.36}" y="36" width="${L * 0.26}" height="28" rx="5"/>${turret(60, -1)}${turret(L - 100)}`;
    case 'uboot':
      return `<rect class="hull" x="10" y="31" width="${L - 20}" height="38" rx="19"/><rect class="deck" x="${L * 0.42}" y="40" width="${L * 0.16}" height="20" rx="8"/>
        <path class="det" d="M16 50 h-8 M18 40 l-10 -6 M18 60 l-10 6"/><path class="det" d="M${L * 0.2} 50 H${L * 0.38} M${L * 0.62} 50 H${L * 0.8}" opacity=".5"/>`;
    case 'fregatte':
      return `${hull(25, 75)}<circle class="deck" cx="52" cy="50" r="18"/><path class="det" d="M45 41 v18 M59 41 v18 M45 50 h14"/><rect class="deck" x="${L * 0.38}" y="36" width="${L * 0.24}" height="28" rx="5"/>${turret(L - 90)}`;
    case 'werkstatt':
      return `${hull(24, 76)}<rect class="deck" x="30" y="34" width="${L * 0.22}" height="32" rx="4"/><rect class="deck" x="${L * 0.52}" y="36" width="44" height="28"/>
        <path class="det" d="M${L * 0.42} 50 L${L * 0.74} 22 M${L * 0.74} 22 v18"/><circle class="ink" cx="${L * 0.42}" cy="50" r="5"/>`;
    case 'zerstoerer':
      return `${hull(28, 72)}<rect class="deck" x="${L * 0.3}" y="38" width="${L * 0.24}" height="24" rx="5"/><ellipse class="deck" cx="${L * 0.62}" cy="50" rx="10" ry="7"/>${turret(L - 62)}`;
    case 'patrouille':
      return `${hull(30, 70)}<rect class="deck" x="${L * 0.38}" y="38" width="${L * 0.26}" height="24" rx="6"/><circle class="deck" cx="${L - 52}" cy="50" r="6"/>`;
    case 'minenleger':
      return `${hull(26, 74)}<rect class="deck" x="${L * 0.5}" y="36" width="${L * 0.22}" height="28" rx="5"/>
        ${[30, 52, 74].map((x) => `<circle class="ink" cx="${x}" cy="40" r="5.5"/><circle class="ink" cx="${x}" cy="60" r="5.5"/>`).join('')}<path class="det" d="M20 40 H86 M20 60 H86"/>`;
    case 'korvette':
      return `${hull(28, 72)}<rect class="deck" x="${L * 0.36}" y="38" width="${L * 0.22}" height="24" rx="5"/>${turret(L - 60)}<path class="det" d="M18 38 h28 M18 62 h28"/><circle class="deck" cx="26" cy="44" r="4"/><circle class="deck" cx="26" cy="56" r="4"/>`;
  }
  return hull();

function shipSVG(k, v = false, cls = '') {
  const len = SV.SHIP[k].len, L = len * 100;
  return v
    ? `<svg class="ship ${cls}" viewBox="0 0 100 ${L}" preserveAspectRatio="none" aria-hidden="true"><g transform="translate(100 0) rotate(90)">${shipBody(k, L)}</g></svg>`
    : `<svg class="ship ${cls}" viewBox="0 0 ${L} 100" preserveAspectRatio="none" aria-hidden="true">${shipBody(k, L)}</svg>`;
}
const sil = (k, h = 18) => `<svg class="ship sil" viewBox="0 0 ${SV.SHIP[k].len * 100} 100" style="height:${h}px;width:${SV.SHIP[k].len * h}px" aria-hidden="true">${shipBody(k, SV.SHIP[k].len * 100)}</svg>`;

/* Muster-Vorschau für Regeln und Infos */
function miniPattern(ab) {
  const n = ab === 'radar' || ab === 'torpedo' ? 7 : 5, c = Math.floor(n / 2), on = new Set(), inl = new Set(), tr = new Set();
  const a = { t: ab, i: SV.ix(c, c), j: SV.ix(c - 1, c + 1), v: false };
  if (ab === 'schnellfeuer') { on.add(SV.ix(1, 1)); on.add(SV.ix(3, 3)); }
  else if (ab === 'torpedo') { for (let x = 0; x < 5; x++) tr.add(SV.ix(c, x)); on.add(SV.ix(c, 5)); }
  else if (ab === 'shot') on.add(SV.ix(c, c));
  else if (ab === 'reparatur') inl.add(SV.ix(c, c));
  else for (const i of SV.cellsOf(a, n)) (SV.AB[ab].kind === 'intel' ? inl : on).add(i);
  let h = `<div class="mini" style="grid-template-columns:repeat(${n},1fr)" aria-hidden="true">`;
  for (let r = 0; r < n; r++) for (let x = 0; x < n; x++) { const i = SV.ix(r, x); h += `<i class="${on.has(i) ? 'on' : inl.has(i) ? 'in' : tr.has(i) ? 'tr' : ''}"></i>`; }
  return h + '</div>';
}

/* ---------- Spielfeld zeichnen ---------- */
function shipPos(s) { const len = SV.SHIP[s.k].len; return `grid-row:${s.r + 2}/span ${s.v ? len : 1};grid-column:${s.c + 2}/span ${s.v ? 1 : len}`; }
function fromCells(k, cells) { const [r, c] = SV.rc(Math.min(...cells)); return { k, r, c, v: cells.length > 1 && Math.abs(cells[1] - cells[0]) === SV.W }; }
const MARK = {
  hit: '<svg viewBox="0 0 24 24"><path class="m-hit" d="M12 1.5l2.3 6.2 6.4-2.5-3.1 6 5.9 3.3-6.6 1.2 1.1 6.7-6-3.4-6 3.4 1.1-6.7L.6 14.5l5.9-3.3-3.1-6 6.4 2.5z"/></svg>',

  spot: '<svg viewBox="0 0 24 24"><path class="m-spot" d="M12 3l9 9-9 9-9-9z"/></svg>',
  mine: '<svg viewBox="0 0 24 24"><circle class="m-mine" cx="12" cy="12" r="6.5"/><path class="m-mine" style="stroke:var(--ink);stroke-width:2" d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.8 2.8M15.9 15.9l2.8 2.8M5.3 18.7l2.8-2.8M15.9 8.1l2.8-2.8"/></svg>',
  fix: '<svg viewBox="0 0 24 24"><path class="m-fix" d="M15 3.5a4.5 4.5 0 00-4.8 6L3.8 15.9a2 2 0 002.8 2.8L13 12.3a4.5 4.5 0 006-4.8l-2.7 2.7-2.8-.6-.6-2.8z"/></svg>',
  flak: '<svg viewBox="0 0 24 24"><path class="m-flak" d="M5 5l14 14M19 5L5 19"/></svg>',
};
function fxStyle(i) {
  const f = App.fx[i]; if (!f) return '';
  const age = Date.now() - f.t; if (age > 1400) { delete App.fx[i]; return ''; }
  return ` fx ${f.s}" style="animation-delay:${-age}ms;`;
}
function boardHTML({ n, id, kind, cell = () => ({}), ships = [], ov = {}, locked, zones = [], blocked = null }) {
  let h = `<div class="board ${kind} ${locked ? 'locked' : ''}" id="${id}" style="--n:${n}">`;
  for (let c = 0; c < n; c++) h += `<div class="lbl top" style="grid-column:${c + 2}">${SV.letter(c)}</div>`;
  for (let r = 0; r < n; r++) h += `<div class="lbl side" style="grid-row:${r + 2}">${r + 1}</div>`;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const i = SV.ix(r, c), o = cell(i);
    const blk = blocked?.has(i);
    h += `<button class="cell ${o.c || ''}${blk ? ' blk' : ''}" data-i="${i}" style="grid-row:${r + 2};grid-column:${c + 2}" aria-label="${SV.nato(i)}${blk ? ': kein Schiff möglich' : o.t ? ': ' + o.t : ''}"></button>`;
  }
  for (const z of zones) z.rects.forEach((q, k) => {
    h += `<i class="zone z-${z.t} ${z.cls || ''}" style="grid-row:${q.r0 + 2}/${q.r1 + 3};grid-column:${q.c0 + 2}/${q.c1 + 3}" title="${esc(SV.AB[z.t].n)}: ${z.label}">${k === 0 ? `<b>${z.t === 'wasserbomben' ? (z.label ? z.label + '×' : '0') : z.label}</b>` : ''}</i>`;
  });
  for (const s of ships) h += `<div class="shp ${s.cls || ''}" ${s.id ? `data-ship="${s.id}"` : ''} style="${shipPos(s)}">${shipSVG(s.k, s.v)}</div>`;
  for (const [i, o] of Object.entries(ov)) {
    const [r, c] = SV.rc(+i);
    const fx = o.m ? fxStyle(+i) : '';
    h += `<i class="ov ${o.c || ''}${fx ? fx : '" style="'}grid-row:${r + 2};grid-column:${c + 2}">${o.m ? MARK[o.m] : ''}</i>`;
  }
  return h + '</div>';
}

function viewLobby() {
